/* ---------- Confirmação e lembrete: a dona confirma o horário de um pedido e o cliente recebe a confirmação ---------- */
function agendamentoDoPedido(id){
  return (dadosPainel.agendamentos || []).find(a => a.pedido_id === id && a.status === "confirmado") || null;
}
function quandoCurto(iso){   // "sex 06/11 14:00"
  const tz = dadosPainel.timezone || "America/Sao_Paulo"; const dt = new Date(iso);
  return dt.toLocaleDateString("pt-BR", { timeZone: tz, weekday: "short", day: "2-digit", month: "2-digit" }).replace(/\.,?/g, "").replace(",", "")
    + " " + dt.toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}
function quandoBR(iso){
  const tz = dadosPainel.timezone || "America/Sao_Paulo";
  const dt = new Date(iso);
  return dt.toLocaleDateString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit" })
    + " às " + dt.toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}
// Mesmo texto do modelo confirmacao_horario aprovado na Meta (decisoes/confirmacao-lembrete.md no ai-employees).
function textoConfirmacao(servico, data, hora){
  const s = String(servico || "").trim();
  const quando = data && hora
    ? new Date(data + "T12:00:00Z").toLocaleDateString("pt-BR", { timeZone: "UTC", weekday: "long", day: "2-digit", month: "2-digit" }) + " às " + hora
    : "___";
  return "Olá! Aqui é da equipe " + (dadosPainel.nome || "sua empresa") + ". Seu horário de " + (s ? s.charAt(0).toLowerCase() + s.slice(1) : "___")
    + " está confirmado para " + quando + ". Se precisar remarcar, é só responder esta mensagem.";
}
function formHorario(pedidoId){
  const d = dadosPainel;
  const tz = d.timezone || "America/Sao_Paulo";
  const p = (d.pedidos || []).find(x => x.id === pedidoId) || {};
  const dd = p.dados || {};
  const ag = agendamentoDoPedido(pedidoId);
  const data = ag ? new Date(ag.data_hora).toLocaleDateString("en-CA", { timeZone: tz }) : "";
  const hora = ag ? new Date(ag.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  const servico = (ag && ag.servico) || dd.servico || (d.itens && d.itens[p.item]) || "";
  const endereco = (ag && ag.endereco) || dd.endereco || "";
  const dias = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  return '<div class="fu-form" id="formHorario"><div class="subtitulo" style="margin-top:0;">' + (ag ? 'Remarcar horário' : 'Confirmar horário') + '</div>'
    + '<div class="dois-campos" style="margin-bottom:14px;"><div class="campo"><label for="hrData">Dia</label><input id="hrData" type="date" min="' + hojeNegocio(0) + '" value="' + esc(data) + '"></div>'
    + '<div class="campo"><label for="hrHora">Horário</label><input id="hrHora" type="time" value="' + esc(hora) + '"></div></div>'
    + '<div class="campo"><label for="hrServico">Serviço</label><input id="hrServico" maxlength="80" placeholder="Ex.: Corte e escova" value="' + esc(servico) + '"></div>'
    + '<div class="campo"><label for="hrEndereco">Endereço (se o atendimento for no local do cliente)</label><input id="hrEndereco" maxlength="160" value="' + esc(endereco) + '"></div>'
    + '<div class="fu-previa"><span>' + (AVISOS_ATIVO ? 'O cliente recebe no WhatsApp:' : 'Mensagem de confirmação (o envio automático começa em breve; por enquanto, avise o cliente pelo WhatsApp):') + '</span>'
    + '<p id="hrPrevia">' + esc(textoConfirmacao(servico, data, hora)) + '</p>'
    + (AVISOS_ATIVO || !p.remetente ? '' : '<a class="btn" style="margin-top:8px;" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(p.remetente).replace(/\D/g, '')) + '"'
      + ' onclick="this.href=\'https://wa.me/' + esc(String(p.remetente).replace(/\D/g, '')) + '?text=\'+encodeURIComponent(document.getElementById(\'hrPrevia\').textContent)">Enviar pelo WhatsApp</a>')
    + '</div>'
    + '<small style="display:block;color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5;">'
    + (!AVISOS_ATIVO ? 'Lembrete automático na véspera: em breve. Por enquanto, o horário fica na sua Agenda do painel para você lembrar o cliente.'
      : dias === 0 ? 'Na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.'
      : 'Se o horário for daqui a ' + dias + (dias === 1 ? ' dia' : ' dias') + ' ou mais, na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.') + '</small>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="hrSalvar">' + (ag ? 'Salvar novo horário' : 'Confirmar horário') + '</button>'
    + '<button class="btn" type="button" id="hrCancelar">Cancelar</button><span class="msg" id="hrMsg"></span></div></div>';
}
function ligarHorario(box, redesenhar){
  box.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-conf")); tela.confHorario = tela.confHorario === id ? null : id; redesenhar();
  }));
  if (!$("formHorario")) return;
  const previa = () => { $("hrPrevia").textContent = textoConfirmacao($("hrServico").value, $("hrData").value, $("hrHora").value); };
  ["hrData", "hrHora", "hrServico"].forEach(id => $(id).addEventListener("input", previa));
  $("hrCancelar").addEventListener("click", () => { tela.confHorario = null; redesenhar(); });
  $("hrSalvar").addEventListener("click", () => salvarHorario(tela.confHorario));
}
async function salvarHorario(pedidoId){
  const msg = $("hrMsg"); const btn = $("hrSalvar");
  const data = $("hrData").value, hora = $("hrHora").value, servico = $("hrServico").value.trim();
  msg.className = "msg"; msg.textContent = "";
  if (!data || !hora){ msg.className = "msg erro"; msg.textContent = "Escolha o dia e o horário."; return; }
  if (servico.length < 2){ msg.className = "msg erro"; msg.textContent = "Escreva o serviço."; return; }
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  // Dia e hora no fuso do negócio; o banco converte ("2026-11-06 14:00 America/Sao_Paulo").
  const { data: r, error } = await supa.rpc("confirmar_horario", {
    p_pedido_id: pedidoId, p_data_hora: data + " " + hora + " " + (dadosPainel.timezone || "America/Sao_Paulo"),
    p_servico: servico, p_endereco: $("hrEndereco").value.trim() || null,
  });
  if (error || !r || !r.ok){
    btn.disabled = false; btn.textContent = textoBtn;
    msg.className = "msg erro";
    msg.textContent = /data inv/.test((error && error.message) || "") ? "Escolha um dia e horário a partir de agora." : "Não foi possível salvar agora. Tente de novo em alguns instantes.";
    return;
  }
  tela.confHorario = null;
  carregarPainel();
}
function chipAviso(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<span class="chip ok">Cliente confirmou ✅</span>';
  if (a.confirmacao_cliente === "remarcar") return '<span class="chip alerta">Pediu para remarcar</span>';
  const l = a.lembrete;
  if (l && l.status === "pendente"){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    return '<span class="chip">Lembrete ' + new Date(l.enviar_em).toLocaleDateString("pt-BR", { timeZone: tz, day: "2-digit", month: "2-digit" }) + '</span>';
  }
  if (l && l.status === "enviado") return '<span class="chip">Lembrete enviado</span>';
  return "";
}
function linhaLembrete(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<br><b>Lembrete:</b> o cliente confirmou o horário.';
  if (a.confirmacao_cliente === "remarcar") return '<br><b>Lembrete:</b> o cliente pediu para remarcar. Fale com ele no WhatsApp.';
  const l = a.lembrete;
  if (!l) return "";
  if (l.status === "pendente") return '<br><b>Lembrete:</b> sai ' + esc(quandoBR(l.enviar_em)) + ', pedindo para o cliente confirmar.';
  if (l.status === "enviado") return '<br><b>Lembrete:</b> enviado. O cliente ainda não respondeu.';
  if (l.status === "falhou") return '<br><b>Lembrete:</b> não foi possível enviar. Avise o cliente pelo WhatsApp.';
  return "";
}
function blocoLembrete(d){
  const atual = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  const ops = [[0, "Todos os horários"], [2, "Marcados com 2 dias ou mais de antecedência"], [3, "Marcados com 3 dias ou mais de antecedência"],
    [7, "Marcados com 1 semana ou mais de antecedência"], [14, "Marcados com 2 semanas ou mais de antecedência"]];
  if (!ops.some(o => o[0] === atual)) ops.push([atual, "Marcados com " + atual + " dias ou mais de antecedência"]);
  return '<div class="lembrete-cfg"><label for="lembreteDias" class="subtitulo" style="display:block;">Lembrete na véspera' + (AVISOS_ATIVO ? '' : ' (em breve)') + ': para quais horários?</label>'
    + '<select id="lembreteDias">' + ops.map(([v, n]) => '<option value="' + v + '"' + (v === atual ? ' selected' : '') + '>' + esc(n) + '</option>').join("") + '</select>'
    + '<small>Um dia antes, às 10h, o cliente recebe um lembrete e responde "Confirmo" ou "Preciso remarcar". A resposta aparece aqui no agendamento.</small>'
    + '<span class="msg" id="lembreteMsg"></span></div>';
}
async function salvarLembrete(valor){
  const msg = $("lembreteMsg"); const sel = $("lembreteDias");
  sel.disabled = true; msg.className = "msg"; msg.textContent = "Salvando...";

  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar. Tente de novo."; return; }

}

function ligarAgenda(){

async function salvarAgenda(valor){
  const msg = $("agendaMsg"); const btn = $("salvarAgenda");
  const agenda = String(valor || "").trim().toLowerCase();
  msg.className = "msg"; msg.textContent = "";
  if (agenda && !/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(agenda)){
    msg.className = "msg erro"; msg.textContent = "Confira o e-mail da agenda, como seuemail@gmail.com."; return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("conectar_agenda", { p_agenda: agenda });
  btn.disabled = false; btn.textContent = "Conectar agenda";
  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  dadosPainel.agenda_conectada = agenda || null;
  dadosPainel.usa_agenda = !!agenda || (dadosPainel.agendamentos || []).length > 0;
  tela.editarAgenda = false;
  renderAgenda();
}

async function mudarAgendamento(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-statusag");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_agendamento", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("agMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela; "hoje" no menu e no início conta só os confirmados de hoje.
  const ag = dadosPainel.agendamentos.find(a => a.id === id);
  if (ag){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    const diaDe = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
    const ehHoje = diaDe(ag.data_hora) === diaDe(new Date().toISOString());
    if (ehHoje && ag.status === "confirmado" && status !== "confirmado") dadosPainel.agendamentos_hoje = Math.max(0, Number(dadosPainel.agendamentos_hoje || 0) - 1);
    if (ehHoje && ag.status !== "confirmado" && status === "confirmado") dadosPainel.agendamentos_hoje = Number(dadosPainel.agendamentos_hoje || 0) + 1;
    ag.status = status;
  }
  tela.agendamento = null;
  render(dadosPainel);
}

// Pagamento registrado pela dona: é a evidência que libera a resposta "pagamento recebido".
async function registrarPagamento(btn){
  const id = Number(btn.getAttribute("data-pago")), pago = btn.getAttribute("data-valor") === "1";
  if (pago && !confirm("Confirma que o pagamento deste pedido já caiu na conta (não só o comprovante)?")) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("registrar_pagamento", { p_pedido_id: id, p_pago: pago });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("pedMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  const p = (dadosPainel.pedidos || []).find(x => x.id === id);
  if (p) p.pago_em = data.pago_em || null;
  renderPedidos();
}

async function mudarStatus(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-status");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_pedido", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("pedMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela sem recarregar tudo; o pedido sai da aba atual e fica fechado.
  const antes = dadosPainel.pedidos.find(p => p.id === id);
  if (antes){
    if (antes.status === "pendente" && status !== "pendente") dadosPainel.pedidos_pendentes = Math.max(0, Number(dadosPainel.pedidos_pendentes || 0) - 1);
    if (antes.status !== "pendente" && status === "pendente") dadosPainel.pedidos_pendentes = Number(dadosPainel.pedidos_pendentes || 0) + 1;
    antes.status = status; antes.status_em = new Date().toISOString();
  }
  tela.pedido = null;
  render(dadosPainel);
}

    if (businessId) u.searchParams.set("client_reference_id", "negocio_" + businessId);

function renderFaqLista(){
  const lista = $("faqLista");

    const q = document.createElement("input"); q.value = f.pergunta; q.placeholder = "Pergunta (ex.: Vocês atendem aos domingos?)";
    q.addEventListener("input", () => { f.pergunta = q.value; });
    const a = document.createElement("textarea"); a.value = f.resposta; a.placeholder = "Sua resposta";
    a.addEventListener("input", () => { f.resposta = a.value; });
    const del = document.createElement("button"); del.type = "button"; del.className = "faq-del"; del.textContent = "×"; del.title = "Remover";
    del.addEventListener("click", () => { faqEdicao.splice(i, 1); renderFaqLista(); });

    const primeiro = new Date(Date.UTC(tela.agAno, tela.agMesN - 1, 1));
    const ini = (primeiro.getUTCDay() + 6) % 7;   // segunda = 0
    const nDias = new Date(Date.UTC(tela.agAno, tela.agMesN, 0)).getUTCDate();
    const total = Math.ceil((ini + nDias) / 7) * 7;
    for (let i = 0; i < total; i++){
      const dn = i - ini + 1;
      if (dn < 1 || dn > nDias){ html += '<div class="ma-dia fora"></div>'; continue; }
      const dia = tela.agAno + "-" + String(tela.agMesN).padStart(2, "0") + "-" + String(dn).padStart(2, "0");
      const inf = (m && m.dias && m.dias[dia]) || null; const nAg = (m && m.agendamentos && m.agendamentos[dia]) || 0;
      let et = '', cls = '';
      const E = (c, tx, cp) => '<span class="et ' + c + '"><span class="tx">' + tx + '</span><span class="cp">' + cp + '</span></span>';
      if (!m) et = '';
      else if (inf && inf.livres === 0 && inf.bloqueados > 0 && !inf.ocupados){ et = E('folga', 'Folga', 'folga'); cls = ' folga'; }
      else if (inf && inf.livres === 0 && inf.ocupados > 0) et = E('cheio', 'Lotado', 'cheio');
      else if (inf && inf.livres > 0) et = E(inf.livres <= 2 ? 'quase' : 'livre', inf.livres + (inf.livres === 1 ? ' livre' : ' livres'), inf.livres + ' liv');
      else if (dia >= hoje) et = E('folga', 'Fechado', '—');
      html += '<button type="button" class="ma-dia' + cls + (dia === hoje ? ' hoje' : '') + (tela.agDia === dia ? ' sel' : '') + '" data-madia="' + dia + '">'
        + '<span class="n">' + dn + '</span>' + et + (nAg ? '<span class="et marc"><span class="tx">' + nAg + (nAg === 1 ? ' marcado' : ' marcados') + '</span><span class="cp">' + nAg + ' marc</span></span>' : '') + '</button>';
    }
    html += '</div>';
    if (tela.agDia) html += detalheDiaAgenda(tela.agDia, cfg);
    if (!m) setTimeout(async () => { await carregarMes(tela.agAno, tela.agMesN); renderMinhaAgenda(); }, 0);
  }
  if (tela.abaMA === "horarios") html += htmlAvisosAgenda(cfg, !!(g.avisos_no_plano === false));
  box.innerHTML = html;
  box.querySelectorAll("[data-abama]").forEach(b => b.addEventListener("click", () => { tela.abaMA = b.getAttribute("data-abama"); renderMinhaAgenda(); }));
  box.querySelectorAll("[data-mamov]").forEach(b => b.addEventListener("click", () => {
    let mm = tela.agMesN + Number(b.getAttribute("data-mamov")), aa = tela.agAno; if (mm < 1){ mm = 12; aa--; } if (mm > 12){ mm = 1; aa++; }
    tela.agAno = aa; tela.agMesN = mm; tela.agDia = null; renderMinhaAgenda(); }));
  box.querySelectorAll("[data-madia]").forEach(b => b.addEventListener("click", async () => {
    const dia = b.getAttribute("data-madia"); if (tela.agDia === dia){ tela.agDia = null; renderMinhaAgenda(); return; }
    tela.agDia = dia; tela.agDiaDados = undefined; renderMinhaAgenda(); await carregarDia(dia); renderMinhaAgenda(); }));
  if ($("maFolgaVarios")) $("maFolgaVarios").addEventListener("click", () => { tela.maFolgaForm = !tela.maFolgaForm; renderMinhaAgenda(); });
  if ($("maFolgaSalvar")) $("maFolgaSalvar").addEventListener("click", async () => {
    const de = $("maDe").value, ate = $("maAte").value || de; const msg = $("maFolgaMsg");
    if (!de || ate < de){ msg.className = "msg erro"; msg.textContent = "Confira as datas."; return; }
    const { error } = await supa.rpc("agenda_bloquear", { p_inicio: null, p_dia_de: de, p_dia_ate: ate, p_motivo: $("maMotivo").value.trim() || "Folga" });
    if (error){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar."; return; }
    tela.maFolgaForm = false; await recarregarAgenda(); });
  ligarDiaAgenda(box);
  ligarAvisosAgenda();
  ligarMeusHorarios(box);
  box.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", (e) => { e.preventDefault(); irPara(b.getAttribute("data-ir")); }));
}
async function recarregarAgenda(){
  if (tela.agMes) delete tela.agMes[tela.agAno + "-" + tela.agMesN];
  await carregarMes(tela.agAno, tela.agMesN);
  if (tela.agDia) await carregarDia(tela.agDia);
  renderMinhaAgenda();
}
function detalheDiaAgenda(dia, cfg){
  const dd = tela.agDiaDados;
  const r0 = new Date(dia + "T12:00:00Z").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", timeZone: "UTC" });
  const rot = r0.charAt(0).toUpperCase() + r0.slice(1);
  let h = '<div class="ma-detalhe"><div class="ma-topo" style="margin-bottom:6px;"><b>' + esc(rot) + '</b>';
  if (dd === undefined) return h + '</div><p class="sub" style="margin:0;">Carregando…</p></div>';
  if (!dd) return h + '</div><p class="sub" style="margin:0;">Não foi possível carregar este dia.</p></div>';
  const diaTodo = (dd.bloqueios || []).filter(b => b.dia_todo);
  h += diaTodo.length ? '<button class="btn" type="button" data-maliberar="' + diaTodo.map(b => b.id).join(",") + '">Desmarcar folga</button>'
                      : '<button class="btn" type="button" data-mafolga="' + dia + '">Folga o dia todo</button>';
  h += '</div>';
  const ags = dd.agendamentos || [];
  const hs = dd.horarios || [];
  if (!hs.length && !ags.length) return h + '<p class="sub" style="margin:0;">' + (diaTodo.length ? 'Folga: a secretária não oferece horários neste dia.' : 'Dia fechado no seu expediente (veja em Meus horários) ou já passou.') + '</p></div>';
  const porHora = {}; ags.forEach(a => { (porHora[a.hora] = porHora[a.hora] || []).push(a); });
  hs.forEach(x => {
    const lista = porHora[x.hora] || []; delete porHora[x.hora];
    const quem = lista.map(a => esc(a.servico || 'Atendimento') + ' · ' + esc(a.nome || foneBR(a.remetente)) + (a.status === 'aguardando' ? ' <span class="et quase">aguardando</span>' : '')).join('<br>');
    let acao = '';
    if (x.situacao === 'bloqueado') acao = x.bloqueio && !diaTodo.some(b => b.id === x.bloqueio) ? '<button class="btn" type="button" data-maliberar="' + x.bloqueio + '">Liberar</button>' : '';
    else if (!lista.length) acao = '<button class="btn" type="button" data-mabloq="' + esc(x.inicio) + '">Bloquear</button>';
    h += '<div class="ma-h"><span class="hh">' + esc(x.hora) + '</span><span class="qq">' + (quem || (x.situacao === 'bloqueado' ? 'Bloqueado' : x.situacao === 'ocupado' ? 'Ocupado' : '<span style="color:#6EE7B7;">Livre</span>')) + '</span>' + acao + '</div>';
  });
  Object.keys(porHora).sort().forEach(hr => porHora[hr].forEach(a => {
    h += '<div class="ma-h"><span class="hh">' + esc(hr) + '</span><span class="qq">' + esc(a.servico || 'Atendimento') + ' · ' + esc(a.nome || foneBR(a.remetente)) + '</span></div>'; }));
  return h + '<p class="sub" style="margin:8px 0 0;font-size:12.5px;">Para ver ou mudar um agendamento, use a lista de agendamentos abaixo.</p></div>';
}
function ligarDiaAgenda(box){
  box.querySelectorAll("[data-mabloq]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true; const { error } = await supa.rpc("agenda_bloquear", { p_inicio: b.getAttribute("data-mabloq"), p_dia_de: null, p_dia_ate: null, p_motivo: "Bloqueado" });
    if (error){ b.disabled = false; b.textContent = "Tente de novo"; return; } await recarregarAgenda(); }));
  box.querySelectorAll("[data-mafolga]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true; const dia = b.getAttribute("data-mafolga");
    const { error } = await supa.rpc("agenda_bloquear", { p_inicio: null, p_dia_de: dia, p_dia_ate: dia, p_motivo: "Folga" });
    if (error){ b.disabled = false; b.textContent = "Tente de novo"; return; } await recarregarAgenda(); }));
  box.querySelectorAll("[data-maliberar]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    for (const id of b.getAttribute("data-maliberar").split(",")) await supa.rpc("agenda_desbloquear", { p_id: Number(id) });
    await recarregarAgenda(); }));
}
function formMeusHorarios(cfg){
  const sem = cfg.semana || {};
  const ordem = [1, 2, 3, 4, 5, 6, 0];
  const op = (vals, atual, rot) => vals.map(v => '<option value="' + v + '"' + (Number(atual) === v ? ' selected' : '') + '>' + rot(v) + '</option>').join("");
  let h = '<label class="ma-chave"><input type="checkbox" id="maAtivo"' + (cfg.ativo ? ' checked' : '') + '><span><b>Secretária marca os horários sozinha</b>'
    + '<small>Ela oferece só os horários livres desta agenda e confirma com o cliente na conversa. Não precisa de Google Agenda.</small></span></label>'
    + '<label class="ma-chave"><input type="checkbox" id="maAprovar"' + (cfg.aprovar ? ' checked' : '') + '><span><b>Quero aprovar cada horário antes</b>'
    + '<small>O horário fica reservado como "aguardando" e você aprova com 1 toque em Agendamentos. O cliente recebe "a equipe confirma por aqui".</small></span></label>'
    + '<div class="subtitulo" style="margin-top:14px;">Dias e horários de atendimento</div>'
    + '<div style="overflow-x:auto;"><table class="ma-semana"><thead><tr><th>Dia</th><th>Abre</th><th>Fecha</th><th class="pz">Almoço de</th><th class="pz">até</th></tr></thead><tbody>';
  ordem.forEach(dw => {
    const x = sem[String(dw)] || {}; const ab = !!x.aberto;
    const t = (id, v) => '<input type="time" id="' + id + dw + '" value="' + esc(v || "") + '"' + (ab ? '' : ' disabled') + '>';
    h += '<tr><td><label style="display:flex;gap:8px;align-items:center;cursor:pointer;"><input type="checkbox" data-maaberto="' + dw + '"' + (ab ? ' checked' : '') + '> ' + NOMES_DIA[dw] + '</label></td>'
      + '<td>' + t("maIni", x.inicio || "09:00") + '</td><td>' + t("maFim", x.fim || "18:00") + '</td>'
      + '<td class="pz">' + t("maPi", x.pausa_inicio || "") + '</td><td class="pz">' + t("maPf", x.pausa_fim || "") + '</td></tr>';
  });
  h += '</tbody></table></div>'
    + '<div class="dois-campos" style="margin-top:14px;">'
    + '<div class="campo"><label for="maDur">Duração de cada atendimento</label><select class="ma-sel" id="maDur">' + op([15, 20, 30, 40, 45, 60, 90, 120, 180], cfg.duracao, v => v < 60 ? v + ' min' : (v / 60) + (v === 60 ? ' hora' : ' horas')) + '</select></div>'
    + '<div class="campo"><label for="maSim">Atendimentos ao mesmo tempo</label><select class="ma-sel" id="maSim">' + op([1, 2, 3, 4, 5, 6, 8, 10], cfg.simultaneos, v => v + (v === 1 ? ' (só um por vez)' : '')) + '</select></div>'
    + '<div class="campo"><label for="maAnt">Antecedência mínima</label><select class="ma-sel" id="maAnt">' + op([0, 1, 2, 3, 4, 12, 24, 48], cfg.antecedencia_h, v => v === 0 ? 'Sem antecedência' : v < 24 ? v + (v === 1 ? ' hora antes' : ' horas antes') : (v / 24) + (v === 24 ? ' dia antes' : ' dias antes')) + '</select></div>'
    + '<div class="campo"><label for="maMesmoDia">Marcar para o mesmo dia</label><select class="ma-sel" id="maMesmoDia">'
    + '<option value="sim"' + (cfg.mesmo_dia === false ? '' : ' selected') + '>Sim, se tiver horário livre</option>'
    + '<option value="nao"' + (cfg.mesmo_dia === false ? ' selected' : '') + '>Não, só a partir do dia seguinte</option></select>'
    + '<small style="display:block;color:var(--muted);font-size:12.5px;margin-top:6px;">Escolha "Não" se você nem sempre está no local: ninguém marca para hoje sem você saber.</small></div>'
    + '<div class="campo"><label for="maFrente">Marcar até quantos dias para frente</label><select class="ma-sel" id="maFrente">' + op([7, 14, 21, 30, 45, 60, 90], cfg.dias_frente, v => v + ' dias') + '</select></div>'
    + '</div>'
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="maSalvar">Salvar meus horários</button><span class="msg" id="maMsg"></span></div>'
    + '<p class="sub" style="margin-top:10px;font-size:12.5px;">Folgas e feriados: marque no <b>Calendário</b>, clicando no dia.</p>';
  return h;
}
const ROT_RESUMO = { vespera: "na véspera, às 19h", manha: "no dia, às 7h", off: "não enviar" };
const ROT_LEMBRETE = { 60: "1 hora antes", 120: "2 horas antes", 0: "não enviar" };
function htmlAvisosAgenda(cfg, trav){
  const res = cfg.resumo || "vespera", lem = Number(cfg.lembrete_dono != null ? cfg.lembrete_dono : 60);
  return '<div class="ma-avisos' + (trav ? ' trav' : '') + '" id="maAvisos">'
    + '<div class="ma-av-topo"><div><div class="ma-av-tit">📲 Avisos da agenda no seu WhatsApp' + (trav ? ' 🔒' : '') + '</div>'
    + (trav ? '<p class="ma-av-trav">Disponível a partir do plano <b>Básico</b>. <a href="#" data-ir="plano">Ver planos</a></p>'
            : '<p class="ma-av-res">Resumo da agenda: <b>' + ROT_RESUMO[res] + '</b><br>Lembrete: <b>' + ROT_LEMBRETE[lem] + '</b></p>')
    + '<span class="msg" id="maAvMsg"></span></div>'
    + (trav ? '' : '<button class="btn btn-ghost" type="button" id="maAvAbrir">Alterar</button>') + '</div>'
    + '<div id="maAvForm" style="display:none;">'
    + '<p class="ma-av-sub">A secretária manda para o seu WhatsApp de avisos. Assim você não esquece nenhum horário.</p>'
    + '<div class="ma-av-op"><label for="maResumo"><b>1. Resumo da agenda</b><span>Lista dos horários do dia. Só chega nos dias com horário marcado.</span></label>'
    + '<select class="ma-sel" id="maResumo">'
    + [["vespera", "Na véspera, às 19h"], ["manha", "No dia, às 7h"], ["off", "Não enviar"]]
        .map(([v, n]) => '<option value="' + v + '"' + (res === v ? ' selected' : '') + '>' + n + '</option>').join("") + '</select>'
    + '<div class="ma-av-ex"><small>Exemplo da mensagem:</small>📅 Agenda de amanhã: 2 horários<br>09:00 · Corte · Bia<br>14:00 · Escova · Lia</div></div>'
    + '<div class="ma-av-op"><label for="maLembrete"><b>2. Lembrete antes de cada horário</b><span>Um aviso pouco antes de cada cliente chegar.</span></label>'
    + '<select class="ma-sel" id="maLembrete">'
    + [[60, "1 hora antes"], [120, "2 horas antes"], [0, "Não enviar"]]
        .map(([v, n]) => '<option value="' + v + '"' + (lem === v ? ' selected' : '') + '>' + n + '</option>').join("") + '</select>'
    + '<div class="ma-av-ex"><small>Exemplo da mensagem:</small>⏰ Daqui a 1 hora: 10:00 · Corte · Bia</div></div>'
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="maAvSalvar">Salvar avisos</button>'
    + '<button class="btn btn-ghost" type="button" id="maAvCancelar">Cancelar</button><span class="msg" id="maAvErro"></span></div>'
    + '</div></div>';
}
function ligarAvisosAgenda(){
  const abrir = $("maAvAbrir"); if (!abrir) return;
  const form = $("maAvForm");
  abrir.addEventListener("click", () => { form.style.display = ""; abrir.style.display = "none"; $("maAvMsg").textContent = ""; });
  $("maAvCancelar").addEventListener("click", () => renderMinhaAgenda());
  $("maAvSalvar").addEventListener("click", async () => {
    const p = Object.assign({}, agendaCfg.config, { resumo: $("maResumo").value, lembrete_dono: Number($("maLembrete").value) });
    const btn = $("maAvSalvar"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
    const { data, error } = await supa.rpc("salvar_agenda_config", { p });
    btn.disabled = false; btn.textContent = "Salvar avisos";
    if (error || !data || !data.ok){ const e = $("maAvErro"); e.className = "msg erro"; e.textContent = "Não foi possível salvar. Tente de novo."; return; }
    agendaCfg.config = data.config; renderMinhaAgenda();
    const m = $("maAvMsg"); if (m){ m.className = "msg ok"; m.textContent = "Avisos salvos ✓"; }
    const box = $("maAvisos"); if (box) box.scrollIntoView({ block: "nearest" });
  });
}
function ligarMeusHorarios(box){
  box.querySelectorAll("[data-maaberto]").forEach(c => c.addEventListener("change", () => {
    const dw = c.getAttribute("data-maaberto"); ["maIni", "maFim", "maPi", "maPf"].forEach(id => { const el = $(id + dw); if (el) el.disabled = !c.checked; }); }));
  if (!$("maSalvar")) return;
  $("maSalvar").addEventListener("click", async () => {
    const msg = $("maMsg"); const semana = {};
    for (const dw of [0, 1, 2, 3, 4, 5, 6]){
      const ab = box.querySelector('[data-maaberto="' + dw + '"]').checked;
      const ini = $("maIni" + dw).value, fim = $("maFim" + dw).value, pi = $("maPi" + dw).value, pf = $("maPf" + dw).value;
      if (ab && (!ini || !fim || fim <= ini)){ msg.className = "msg erro"; msg.textContent = NOMES_DIA[dw] + ": o horário de fechar precisa ser depois do de abrir."; return; }
      if (ab && pi && pf && pf <= pi){ msg.className = "msg erro"; msg.textContent = NOMES_DIA[dw] + ": confira o horário de almoço."; return; }
      semana[dw] = ab ? Object.assign({ aberto: true, inicio: ini, fim: fim }, pi && pf ? { pausa_inicio: pi, pausa_fim: pf } : {}) : { aberto: false };
    }
    const dur = Number($("maDur").value);
    const p = { ativo: $("maAtivo").checked, aprovar: $("maAprovar").checked, duracao: dur, passo: Math.min(dur, 60), simultaneos: Number($("maSim").value),
      antecedencia_h: Number($("maAnt").value), mesmo_dia: $("maMesmoDia").value !== "nao", dias_frente: Number($("maFrente").value), resumo: agendaCfg.config.resumo, lembrete_dono: agendaCfg.config.lembrete_dono, semana };
    const btn = $("maSalvar"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
    const { data, error } = await supa.rpc("salvar_agenda_config", { p });
    btn.disabled = false; btn.textContent = "Salvar meus horários";
    if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar. Confira os horários e tente de novo."; return; }
    agendaCfg.config = data.config; tela.agMes = {}; tela.agDia = null;
    renderMinhaAgenda(); const m2 = $("maMsg"); if (m2){ m2.className = "msg ok"; m2.textContent = "Salvo ✓" + (data.config.ativo ? " A secretária já usa estes horários." : ""); }
  });
}

$("logoutBtn").addEventListener("click", async () => { await supa.auth.signOut(); mostrar("login"); });
$("refreshBtn").addEventListener("click", carregarPainel);

(async function iniciar(){
  if (erroNoLink){
    mostrar("login");
    aviso("loginError", "Este link expirou ou já foi usado. Digite seu e-mail e clique em “Esqueci minha senha” para receber um novo.");

    return;
  }
  const { data: { session } } = await supa.auth.getSession();
  if (session && precisaCriarSenha){ mostrar("senha"); return; }
