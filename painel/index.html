<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auryx — Painel da AI Secretária</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    /* Azul-marinho com destaque azul. Os nomes antigos (gold, parchment) ficaram para não mexer no resto do CSS. */
    --ink:#0B1220; --panel:#0F172A; --panel-2:#131D33; --panel-3:#18233B;
    --line: rgba(148,163,184,0.14); --line-strong: rgba(96,165,250,0.40);
    --gold:#2563EB; --gold-bright:#60A5FA; --parchment:#E2E8F0; --muted:#94A3B8;
    --good:#34D399; --bad:#F87171; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--ink);
    color:var(--parchment); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  a{color:inherit;}
  .wrap{ max-width:1000px; margin:0 auto; padding:0 clamp(20px,5vw,48px); width:100%; }

  nav.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px clamp(20px,5vw,48px); border-bottom:1px solid var(--line);
  }
  .brand-mark{ height:34px; width:auto; }
  .btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 22px; border-radius:22px; cursor:pointer; border:1px solid var(--line-strong);
    background:transparent; color:var(--parchment); transition:.2s border-color, .2s background;
  }
  .btn:hover{ border-color:var(--gold); }
  .btn-primary{ background:var(--gold); color:#fff; border:1px solid var(--gold); box-shadow:0 6px 18px -8px rgba(37,99,235,0.7); }
  .btn-primary:hover{ background:#1D4ED8; border-color:#1D4ED8; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }

  /* ---------- Login screen ---------- */
  .login-card{
    max-width:400px; width:100%; border:1px solid var(--line); border-radius:14px; padding:40px 34px;
    background:var(--panel);
  }
  .login-card .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; color:var(--gold);
    text-transform:uppercase; margin:0 0 12px; display:flex; align-items:center; gap:10px;
  }
  .login-card .eyebrow::before{ content:''; width:20px; height:1px; background:var(--gold); }
  .login-card h1{ font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0 0 8px; }
  .login-card .sub{ color:var(--muted); font-size:14px; margin:0 0 30px; line-height:1.5; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:500; margin-bottom:7px; color:var(--parchment); }
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--parchment);
    border-radius:8px; padding:12px 14px; font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{ outline:none; border-color:var(--gold); background:var(--panel-3); }
  .login-card .btn{ width:100%; text-align:center; padding:13px; font-size:14.5px; margin-top:6px; }
  .error-msg{
    background:rgba(185,112,94,0.1); border:1px solid rgba(185,112,94,0.3); color:var(--bad);
    border-radius:8px; padding:11px 14px; font-size:13px; margin-bottom:18px; display:none;
  }
  .error-msg.show{ display:block; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(0,0,0,0.25); border-top-color:#1a1608; border-radius:50%;
    display:inline-block; vertical-align:middle; margin-right:8px; animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Dashboard screen ---------- */
  .dash{ display:none; }
  body.modo-painel nav.topbar{ display:none; }
  body.modo-painel main{ display:block; padding:0; }
  .dash.show{ display:block; min-height:100vh; }
  .side{ position:fixed; inset:0 auto 0 0; width:250px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:20; transition:transform .2s; }
  .side-topo{ display:flex; align-items:center; gap:10px; padding:20px 20px 18px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
  .side-logo{ height:30px; width:auto; }
  .menu{ display:flex; flex-direction:column; gap:2px; padding:14px 10px; flex:1; overflow-y:auto; }
  .menu button{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; background:transparent; border:none;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; padding:11px 12px; border-radius:8px; transition:.15s background, .15s color; }
  .menu button svg{ flex:none; }
  .menu button .nome{ flex:1; }
  .menu button:hover{ color:var(--parchment); background:var(--panel-2); }
  .menu button.ativo{ color:#fff; background:rgba(37,99,235,0.18); }
  .menu button.ativo svg{ color:var(--gold-bright); }
  .side-pe{ border-top:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .side-negocio{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-sair{ padding:7px 14px; font-size:12.5px; }
  .side-fundo{ display:none; }
  .conteudo{ margin-left:250px; min-height:100vh; }
  .cab{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:14px 28px; background:rgba(11,18,32,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .cab-menu{ display:none; background:none; border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:7px; cursor:pointer; }
  .cab-titulo{ flex:1; min-width:0; }
  .cab-titulo .t{ font-size:18px; font-weight:600; }
  .cab-titulo .s{ font-size:13.5px; color:var(--muted); margin-top:2px; }
  .cab-dir{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:rgba(37,99,235,0.22); color:var(--gold-bright); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; }
  .avatar:empty{ display:none; }
  .quem{ font-size:14px; font-weight:500; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .area{ padding:24px 28px 40px; max-width:1240px; }
  .aviso{ display:flex; align-items:flex-start; gap:12px; border-radius:12px; padding:16px 18px; margin-bottom:16px; border:1px solid; }
  .aviso svg{ flex:none; margin-top:2px; }
  .aviso .txt{ flex:1; font-size:14px; line-height:1.5; }
  .aviso .txt b{ display:block; font-weight:600; margin-bottom:2px; }
  .aviso.info{ background:rgba(37,99,235,0.10); border-color:rgba(37,99,235,0.35); color:#BFDBFE; }
  .aviso.atencao{ background:rgba(245,158,11,0.08); border-color:rgba(245,158,11,0.45); color:#FCD34D; }
  .aviso .btn{ flex:none; padding:9px 16px; font-size:13px; }
  .cartoes{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
  .cartao{ text-align:left; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:18px 20px; color:var(--parchment); font-family:'Inter',sans-serif; }
  button.cartao{ cursor:pointer; }
  button.cartao:hover{ border-color:var(--line-strong); }
  .cartao .l{ color:var(--muted); font-size:14px; }
  .cartao .n{ font-size:30px; font-weight:700; margin-top:8px; }
  .cartao .n small{ font-size:14px; font-weight:500; color:var(--muted); margin-left:4px; }
  .cartao .x{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .cartao.destaque{ background:var(--gold); border-color:var(--gold); }
  .cartao.destaque .l, .cartao.destaque .x, .cartao.destaque .n small{ color:rgba(255,255,255,0.85); }
  .cartao .barra{ height:6px; border-radius:4px; background:rgba(255,255,255,0.25); margin-top:12px; overflow:hidden; }
  .cartao .barra div{ height:100%; background:#fff; }
  .cartao .n.alerta{ color:var(--gold-bright); }
  @media (max-width:1000px){ .cartoes{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:900px){
    .side{ transform:translateX(-100%); }
    .side.aberta{ transform:none; box-shadow:0 0 40px rgba(0,0,0,0.6); }
    .side-fundo.aberta{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:15; }
    .conteudo{ margin-left:0; }
    .cab{ padding:12px 16px; }
    .cab-menu{ display:inline-flex; }
    .quem, .cab-dir .badge{ display:none; }
    .area{ padding:18px 16px 32px; }
    .aviso{ flex-wrap:wrap; }
  }
  @media (max-width:480px){ .cartoes{ grid-template-columns:minmax(0,1fr); } }
  .dash-head{ margin-bottom:36px; }
  .dash-head .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; color:var(--gold);
    text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:10px;
  }
  .dash-head .eyebrow::before{ content:''; width:20px; height:1px; background:var(--gold); }
  .dash-head h1{ font-family:'Fraunces', serif; font-weight:500; font-size:30px; margin:0 0 8px; }
  .dash-head .sub{ color:var(--muted); font-size:14.5px; }

  .metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  @media (max-width:760px){ .metric-grid{ grid-template-columns:repeat(2,1fr); } }
  .metric-card{ background:var(--panel); padding:26px 22px; }
  .metric-card .label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; margin-bottom:14px; }
  .metric-card .value{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; color:var(--gold-bright); }
  .metric-card .value.neutral{ color:var(--parchment); }
  .metric-card .value .unit{ font-size:16px; color:var(--muted); font-weight:400; margin-left:4px; }

  .period-note{ text-align:center; color:var(--muted); font-size:13px; margin-top:8px; }

  .empty-state{
    text-align:center; padding:60px 30px; border:1px dashed var(--line-strong); border-radius:12px; color:var(--muted);
  }
  .empty-state p{ font-size:14.5px; line-height:1.6; max-width:44ch; margin:0 auto; }

  .refresh-row{ display:flex; justify-content:flex-end; margin-top:20px; }
  .refresh-row .btn{ font-size:12.5px; padding:9px 18px; }

  .link-btn{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; margin-top:16px; text-decoration:underline; font-family:'Inter',sans-serif; }
  .link-btn:hover{ color:var(--parchment); }
  .ok-msg{ background:rgba(124,184,143,0.1); border:1px solid rgba(124,184,143,0.3); color:var(--good); border-radius:8px; padding:11px 14px; font-size:13px; margin-bottom:18px; display:none; }
  .ok-msg.show{ display:block; }
  .badge{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--line-strong); border-radius:20px; padding:4px 10px; margin-left:10px; vertical-align:middle; }
  .panel{ border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:24px 22px; margin-bottom:20px; }
  .panel h2{ font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:0 0 6px; }
  .panel .sub{ color:var(--muted); font-size:13.5px; margin:0 0 16px; line-height:1.5; }
  .usage-bar{ height:10px; background:var(--panel-3); border-radius:6px; overflow:hidden; margin:12px 0 8px; }
  .usage-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); width:0; transition:width .6s; }
  .usage-fill.alto{ background:linear-gradient(90deg, #c98a27, var(--bad)); }
  .usage-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted); }
  .usage-row strong{ color:var(--parchment); font-size:15px; }
  .pers-lista{ margin:6px 0 0; padding-left:20px; color:var(--parchment); line-height:1.6; font-size:14px; }
  .pers-lista li{ margin-bottom:6px; }
  .planos{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:14px; }
  @media (max-width:700px){ .planos{ grid-template-columns:1fr; } }
  .plano{ border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--panel-2); }
  .plano .n{ font-family:'Fraunces',serif; font-size:17px; margin-bottom:4px; }
  .plano .p{ color:var(--gold-bright); font-weight:600; margin-bottom:4px; }
  .plano .l{ color:var(--muted); font-size:12.5px; margin-bottom:12px; }
  .plano .btn{ width:100%; text-align:center; display:block; text-decoration:none; padding:9px; font-size:13px; }
  .pedido{ border-top:1px solid var(--line); padding:14px 0; }
  .pedido:first-child{ border-top:none; padding-top:0; }
  .pedido .t{ display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-bottom:6px; }
  .pedido .t span{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .pedido .d{ color:var(--muted); font-size:13px; line-height:1.6; }
  .pedido .d b{ color:var(--parchment); font-weight:500; }
  .pedido a{ color:var(--gold-bright); font-size:12.5px; }
  .faq-row{ position:relative; border:1px solid var(--line); border-radius:10px; padding:12px 40px 12px 12px; margin-bottom:12px; background:var(--panel-2); }
  .faq-row input, .faq-row textarea{ width:100%; background:var(--panel-3); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; }
  .faq-row textarea{ min-height:64px; margin-top:8px; resize:vertical; }
  .faq-row input:focus, .faq-row textarea:focus{ outline:none; border-color:var(--gold); }
  .faq-del{ position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .faq-del:hover{ color:var(--bad); }
  .servicos{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:8px 0 6px; }
  @media (max-width:600px){ .servicos{ grid-template-columns:1fr; } }
  .servico{ display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:var(--panel-2); font-size:14px; cursor:pointer; }
  .servico input{ accent-color:var(--gold); width:16px; height:16px; }
  .subtitulo{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; }
  .acoes{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:18px; }
  .acoes .msg{ font-size:13px; }
  .acoes .msg.ok{ color:var(--good); } .acoes .msg.erro{ color:var(--bad); }
  .bloqueado{ color:var(--muted); font-size:14px; line-height:1.6; }
  .conv{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; border-top:1px solid var(--line); padding:14px 0; }
  .conv:first-child{ border-top:none; padding-top:0; }
  .conv .info{ font-size:14px; }
  .conv .info span{ display:block; color:var(--muted); font-size:13px; margin-top:4px; }
  .conv .botoes{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sec-head{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .sec-head h2{ margin:0; }
  .sec-head .sub{ margin:6px 0 0; }
  .contador{ display:inline-block; min-width:22px; padding:2px 8px; margin-left:8px; border-radius:999px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; text-align:center; vertical-align:middle; background:var(--panel-3); color:var(--muted); border:1px solid var(--line); }
  .contador.alerta{ background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600; }
  .sec-corpo{ margin-top:18px; }
  .ajuda{ margin-top:8px; font-size:13px; color:var(--muted); line-height:1.55; max-width:640px; }
  .ajuda summary{ cursor:pointer; color:var(--gold-bright); font-size:13px; width:max-content; }
  .ajuda p{ margin:8px 0 0; }
  .ajuda ul{ margin:6px 0 0; padding-left:18px; }
  .campo{ margin-bottom:16px; }
  .campo label{ display:block; font-size:13px; color:var(--parchment); margin-bottom:6px; }
  .campo input{ width:100%; background:var(--panel-3); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; }
  .campo input:focus{ outline:none; border-color:var(--gold); }
  .campo small{ display:block; color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.5; }
  .ajuda b{ color:var(--parchment); font-weight:500; }
  .abas{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .aba{ font-family:'Inter',sans-serif; font-size:13px; padding:7px 12px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--line); }
  .aba.ativa{ color:#fff; border-color:var(--gold); background:rgba(37,99,235,0.18); }
  .ped-linha{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; cursor:pointer;
    background:transparent; border:none; color:var(--parchment); font-family:'Inter',sans-serif; font-size:14px; padding:0; }
  .ped-linha .quem{ color:var(--muted); font-size:13px; }
  .ped-linha .lado{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .status{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid var(--line); }
  .status.pendente{ color:var(--gold-bright); border-color:var(--line-strong); }
  .status.respondido{ color:var(--parchment); }
  .status.fechado{ color:var(--good); border-color:rgba(124,184,143,0.4); }
  .status.nao_fechou{ color:var(--muted); }
  .ped-detalhe{ margin-top:10px; }
  /* Pagamento registrado: selo verde preenchido (diferente do contorno dos status) para ser visto de relance. */
  .pago{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px;
    color:#052e1c; background:var(--good); font-weight:600; }
  .pago-box{ display:flex; align-items:center; gap:8px; margin-top:10px; padding:9px 12px; border-radius:8px; font-size:13.5px;
    color:var(--good); background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.45); }
  .pago-box b{ color:var(--good); }
  .ped-acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .ped-acoes .btn{ font-size:12.5px; padding:7px 12px; }
  .mais{ margin-top:14px; }
  .ped-acoes .msg{ font-size:13px; color:var(--bad); }
  a.btn{ text-decoration:none; display:inline-block; }
  .pedido a.btn-primary, .conv .botoes a.btn-primary{ color:#fff; font-size:12.5px; }
  .conv .botoes a{ color:var(--gold-bright); font-size:13px; }
  .conv .btn{ padding:8px 16px; font-size:12.5px; }
  /* Visual novo: tudo em Inter, cantos menos arredondados nos botões. */
  .btn{ border-radius:8px; }
  .spinner{ border-color:rgba(255,255,255,0.3); border-top-color:#fff; }
  .panel h2, .login-card h1, .plano .n{ font-family:'Inter',sans-serif; font-weight:600; letter-spacing:-0.01em; }
  .panel h2{ font-size:17px; }
  .metric-card .value{ font-family:'Inter',sans-serif; font-weight:700; font-size:30px; }
  .plano .n, .atalho .n{ font-family:'Inter',sans-serif; font-weight:600; }
  .metric-card .label, .subtitulo, .badge, .contador, .status{ font-family:'Inter',sans-serif; letter-spacing:0; }
  .metric-card .label{ text-transform:none; font-size:13.5px; }
  .badge{ text-transform:none; font-size:12px; color:var(--gold-bright); }
  .status{ text-transform:none; font-size:12px; }
  .status.pendente{ color:#FCD34D; border-color:rgba(245,158,11,0.45); }

<script>
const SUPABASE_URL = "https://ypqmrjvuotctiyydfpgb.supabase.co";

// O link do e-mail (convite ou recuperação) chega com "type=invite" ou "type=recovery" no endereço.

const ROTULOS = { nome: "Nome", tipo: "Tipo", destino: "Destino", datas: "Datas", pessoas: "Pessoas", saida: "Saída de",
  orcamento: "Orçamento", servico: "Serviço", viagem: "Viagem", assunto: "Assunto", roteiro: "Roteiro", interesse: "Interesse",

    dica: "Agradece e pede a opinião do cliente. Bom logo depois do serviço." },
};
const STATUS_FU = { agendado: "Agendado", enviado: "Enviado", falhou: "Não enviado", cancelado: "Cancelado" };

const tela = { abaFu: "agendado", fuForm: null, abaAg: "proximos", agendamento: null, view: (() => { try { return localStorage.getItem("painelView") || "inicio"; } catch (e) { return "inicio"; } })(), aba: "pendente", pedido: null, limite: 20 };

const moeda = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 0 });

}
function aviso(id, msg){ const el = $(id); el.textContent = msg; el.classList.toggle("show", !!msg); }

async function carregarPainel(){
  const content = $("dashContent");
  content.innerHTML = '<div class="empty-state"><p>Carregando…</p></div>';
  const { data, error } = await supa.rpc("get_painel");
  if (error){
    content.innerHTML = '<div class="empty-state"><p>Não conseguimos carregar seus dados agora. Tente atualizar em alguns instantes ou fale com a gente em hello@auryx.digital.</p></div>';

  if (!data){
    $("viewTitulo").textContent = "Painel";
    content.innerHTML = '<div class="empty-state"><p>Não encontramos um negócio ligado a este e-mail. Fale com a gente em hello@auryx.digital.</p></div>';

  }
  const { data: u } = await supa.auth.getUser();
  // Central de Respostas Rápidas: o que a dona mudou na biblioteca (se o SQL ainda não rodou, fica só a padrão).
  try { const r = await supa.rpc("get_respostas_rapidas"); respostasRapidas = Object.assign({ meus: [], favoritos: [], ocultos: [] }, (!r.error && r.data && typeof r.data === "object" && !Array.isArray(r.data)) ? r.data : {}); }
  catch (e) { respostasRapidas = { meus: [], favoritos: [], ocultos: [] }; }
  emailLogado = (u && u.user && u.user.email) || "";
  render(data);
}

function render(d){
  dadosPainel = d;
  const nomeDono = String(d.contato_nome || "").trim();
  const primeiroNome = nomeDono.split(/\s+/)[0];
  const iniciais = (nomeDono || d.nome || "").split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join("");
  $("planBadge").textContent = d.plano_nome || "";
  $("avatar").textContent = iniciais;
  $("quemNome").textContent = nomeDono || d.nome || "";
  $("sideNegocio").textContent = d.nome || "";
  const emTeste = d.plano_id === "trial";
  let trialTxt = "";

    const dias = Math.ceil((new Date(d.trial_fim) - Date.now()) / 86400000);
    trialTxt = dias > 0
      ? "Teste grátis até " + dataBR(d.trial_fim) + " (" + dias + (dias === 1 ? " dia restante)" : " dias restantes)")
      : "Seu teste grátis terminou em " + dataBR(d.trial_fim) + ". Escolha um plano para continuar.";

  // Menu lateral (no celular vira uma barra de botões no topo). Cada item abre uma tela própria.

  const usaAgenda = !!d.usa_agenda || (d.agendamentos || []).length > 0;
  const usaPedidos = !!d.usa_pedidos || (d.pedidos || []).length > 0 || !usaAgenda;
  const menu = [
    ["inicio", "Início", 0],
    ["conversas", "Clientes esperando", convs.length],
  ];
  menu.push(["agenda", "Agendamentos", hoje]);   // sempre no menu; vazio, explica como começar
  if (usaPedidos) menu.push(["pedidos", "Pedidos", pend]);
  menu.push(["followup", "Follow-up", 0]);
  menu.push(["respostas", "Respostas rápidas", 0]);
  menu.push(
    ["personalizar", "Personalizar" + (d.pode_personalizar ? "" : " 🔒"), 0],
    ["dados", "Seus dados", 0],
    ["plano", emTeste ? "Escolher plano" : "Plano", 0]);
  if (!menu.some(m => m[0] === tela.view)) tela.view = "inicio";

    '<button type="button" data-view="' + id + '"' + (tela.view === id ? ' class="ativo" aria-current="page"' : '') + '>' + icone(id)
    + '<span class="nome">' + esc(nome) + '</span>'
    + (n ? '<span class="contador alerta">' + n + '</span>' : '') + '</button>').join("");
  const titulos = {
    inicio: [primeiroNome ? "Olá, " + primeiroNome + " 👋" : "Início", (d.nome ? d.nome + " · " : "") + "acompanhe a sua secretária, " + (usaPedidos ? "os clientes, a agenda e os pedidos" : "os clientes e a agenda")],

    respostas: ["Respostas rápidas", "Textos prontos para a sua equipe responder os clientes pelo WhatsApp"],

    plano: [emTeste ? "Escolher plano" : "Plano", emTeste ? "Continue com a sua secretária depois do teste grátis" : "Seu plano atual"],

    avisos += '<div class="aviso atencao">' + icone("alerta") + '<div class="txt"><b>' + (convs.length === 1 ? '1 cliente esperando atendimento' : convs.length + ' clientes esperando atendimento') + '</b>'
      + 'A secretária pausou essas conversas para alguém da sua equipe responder.</div><button class="btn btn-primary" type="button" data-ir="conversas">Ver clientes</button></div>';
  }

    + '<p>Toque no pedido para ver os detalhes e clique em <b>Responder no WhatsApp</b> para mandar a proposta. Depois mude o status: '
    + '<b>Respondido</b> quando enviar a proposta, <b>Venda fechada</b> ou <b>Não fechou</b> no final. Assim a aba Pendentes mostra só o que falta responder.</p>'
    + '</details></div></div>';

    const conta = (s) => todos.filter(p => s === "todos" || p.status === s).length;
    html += '<div class="sec-corpo"><div class="abas">';
    [["pendente", "Pendentes"], ["respondido", "Respondidos"], ["fechado", "Vendas fechadas"], ["nao_fechou", "Não fecharam"], ["todos", "Todos"]].forEach(([s, n]) => {
      html += '<button type="button" class="aba' + (tela.aba === s ? ' ativa' : '') + '" data-aba="' + s + '">' + n + ' (' + (s === "pendente" ? pend : conta(s)) + ')</button>';
    });
    html += '</div>';
    const lista = todos.filter(p => tela.aba === "todos" || p.status === tela.aba);
    if (!lista.length){
      html += '<p class="sub" style="margin:0;">Nenhum pedido aqui.</p>';
    }
    lista.slice(0, tela.limite).forEach(p => {
      const titulo = (d.itens && d.itens[p.item]) || p.item;
      const nome = (p.dados && p.dados.nome) || ('+' + p.remetente);
      const aberto = tela.pedido === p.id;
      html += '<div class="pedido"><button type="button" class="ped-linha" data-pedido="' + p.id + '">'
        + '<span>' + esc(titulo) + ' <span class="quem">· ' + esc(nome) + '</span></span>'
        + '<span class="lado">' + dataHoraBR(p.created_at) + '<span class="status ' + esc(p.status) + '">' + esc(STATUS[p.status] || p.status) + '</span>'
        + (p.pago_em ? '<span class="pago" title="Pagamento registrado em ' + esc(new Date(p.pago_em).toLocaleDateString("pt-BR")) + '">✓ Pago</span>' : '') + (aberto ? '▴' : '▾') + '</span></button>';
      if (aberto){
        const campos = Object.entries(p.dados || {}).map(([k, v]) => '<b>' + esc(ROTULOS[k] || (k.charAt(0).toUpperCase() + k.slice(1))) + ':</b> ' + esc(v)).join(' · ');
        const agP = agendamentoDoPedido(p.id);
        html += '<div class="ped-detalhe"><div class="d">' + campos + '<br><b>Contato:</b> +' + esc(p.remetente)
          + (agP ? '<br><b>Horário confirmado:</b> ' + esc(quandoBR(agP.data_hora)) : '')
          + '</div>' + (p.pago_em ? '<div class="pago-box">✓ <span><b>Pagamento registrado</b> em ' + esc(new Date(p.pago_em).toLocaleDateString("pt-BR")) + '</span></div>' : '')
          + '<div class="ped-acoes">'
          + '<button class="btn btn-primary" type="button" data-resp="p' + p.id + '">Responder no WhatsApp</button>';
        html += '<button class="btn" type="button" data-conf="' + p.id + '">' + (agP ? 'Remarcar horário' : 'Confirmar horário') + '</button>';
        html += '<button class="btn" type="button" data-fu-ped="' + p.id + '">Agendar follow-up</button>';
        Object.keys(STATUS).filter(s => s !== p.status).forEach(s => {
          const rotulo = s === "pendente" ? "Voltar para pendente" : s === "respondido" ? "Marcar como respondido" : STATUS[s];
          html += '<button class="btn" type="button" data-status="' + s + '" data-id="' + p.id + '">' + rotulo + '</button>';
        });
        html += (p.pago_em ? '<button class="btn" type="button" data-pago="' + p.id + '" data-valor="0">Desfazer pagamento</button>'
                           : '<button class="btn" type="button" data-pago="' + p.id + '" data-valor="1">Registrar pagamento</button>');
        html += '<span class="msg" id="pedMsg' + p.id + '"></span></div>' + (tela.resp === "p" + p.id ? formResposta("p" + p.id) : '')
          + (tela.confHorario === p.id ? formHorario(p.id) : '') + '</div>';
      }
      html += '</div>';
    });
    if (lista.length > tela.limite) html += '<div class="mais"><button class="btn" type="button" id="maisPed">Mostrar mais (' + (lista.length - tela.limite) + ')</button></div>';
    html += '</div>';
  }
  box.innerHTML = html;
  if ($("maisPed")) $("maisPed").addEventListener("click", () => { tela.limite += 20; renderPedidos(); });
  box.querySelectorAll("[data-aba]").forEach(b => b.addEventListener("click", () => { tela.aba = b.getAttribute("data-aba"); tela.pedido = null; tela.limite = 20; renderPedidos(); }));
  box.querySelectorAll("[data-pedido]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-pedido")); tela.pedido = tela.pedido === id ? null : id; renderPedidos();
  }));
  box.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => mudarStatus(b)));
  ligarHorario(box, renderPedidos);
  ligarResposta(box, renderPedidos);
  box.querySelectorAll("[data-pago]").forEach(b => b.addEventListener("click", () => registrarPagamento(b)));
  box.querySelectorAll("[data-fu-ped]").forEach(b => b.addEventListener("click", () => {
    const p = (dadosPainel.pedidos || []).find(x => x.id === Number(b.getAttribute("data-fu-ped")));
    if (!p) return;
    novoFollowup({ remetente: p.remetente, nome: (p.dados || {}).nome || "", assunto: assuntoPedido(p), pedido_id: p.id });
  }));
}

/* ---------- Follow-up: o dono escolhe o dia e a secretária manda "Como foi ___?" ---------- */
function exemploAssunto(tipoNegocio, tipo){
  const t = String(tipoNegocio || "").toLowerCase();
  const ex = /viage|turis/.test(t) ? ["a sua viagem para Miami", "a sua última viagem", "a sua viagem para Miami"]
    : /sal[aã]o|beleza|barb|cabel|est[eé]tica|unha/.test(t) ? ["o seu corte e escova", "o seu último corte", "o seu corte e escova"]
    : /cl[ií]nica|consult|odont|sa[uú]de|m[eé]dic|psic|fisio/.test(t) ? ["a sua consulta", "a sua última consulta", "a sua consulta"]
    : /el[eé]tric|encan|hidr|reform|manuten|constru/.test(t) ? ["a instalação do chuveiro", "a última revisão elétrica da sua casa", "a instalação do chuveiro"]
    : /oficina|mec[aâ]n|auto|carro/.test(t) ? ["a revisão do seu carro", "a última revisão do seu carro", "a revisão do seu carro"]
    : ["o serviço que fizemos para você", "o seu último atendimento", "o seu atendimento"];
  return ex[{ como_foi: 0, retorno: 1, agradecimento: 2 }[tipo || "como_foi"] || 0];
}
function textoFollowup(nome, assunto, tipo){
  const n = String(nome || "").trim().split(/\s+/)[0];
  const T = TIPOS_FU[tipo || "como_foi"] || TIPOS_FU.como_foi;
  return "Olá" + (n ? ", " + n : "") + "! Aqui é da equipe " + (dadosPainel.nome || "sua empresa") + T.abertura + T.antes + (assunto || "___") + T.depois;
}
// Tipos liberados no plano (vazio = plano antigo sem a coluna: libera "Como foi").
function tiposDoPlano(){ const t = (dadosPainel && dadosPainel.followup_tipos) || []; return t.length ? t : ["como_foi"]; }
function tipoInicial(){ return tiposDoPlano()[0]; }
function limiteAtingido(){ const d = dadosPainel; return d.followup_limite_mes != null && Number(d.followups_mes || 0) >= Number(d.followup_limite_mes); }
function hojeNegocio(dias){
  const tz = dadosPainel.timezone || "America/Sao_Paulo";
  return new Date(Date.now() + (dias || 0) * 86400000).toLocaleDateString("en-CA", { timeZone: tz });
}

        + '<div class="acoes"><button class="btn btn-primary" type="button" id="fuSalvar">' + (f.id ? 'Salvar alteração' : 'Agendar follow-up') + '</button>'
        + '<button class="btn" type="button" id="fuCancelarForm">Cancelar</button><span class="msg" id="fuMsg"></span></div></div>';
    } else {
      const lim = d.followup_limite_mes;
      html += '<div class="acoes" style="margin:16px 0 4px;"><button class="btn btn-primary" type="button" id="fuNovo"' + (limiteAtingido() ? ' disabled' : '') + '>+ Agendar follow-up</button>'
        + (lim != null ? '<span class="msg" style="color:var(--muted);">' + Number(d.followups_mes || 0) + ' de ' + lim + ' follow-ups usados este mês'
          + (limiteAtingido() ? '. Limite do mês atingido: no plano Completo não há limite.' : '') + '</span>' : '')
        + '</div>';
    }
  }
  if (todos.length){
    const conta = (s) => todos.filter(f => f.status === s || (s === "enviado" && f.status === "falhou")).length;

      html += '<button type="button" class="aba' + (tela.abaFu === s ? ' ativa' : '') + '" data-abafu="' + s + '">' + n + ' (' + conta(s) + ')</button>';
    });

    let lista = todos.filter(f => f.status === tela.abaFu || (tela.abaFu === "enviado" && f.status === "falhou"));
    if (tela.abaFu === "agendado") lista = lista.slice().sort((a, b) => String(a.data_envio).localeCompare(String(b.data_envio)));
    if (!lista.length) html += '<p class="sub" style="margin:0;">Nenhum follow-up aqui.</p>';
    lista.forEach(f => {
      const dia = new Date(f.data_envio + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });
      html += '<div class="pedido"><div class="ped-linha" style="cursor:default;"><span><b>' + esc(dia) + '</b> · ' + esc(f.nome || ("+" + f.remetente))
        + ' <span class="quem">· ' + esc((TIPOS_FU[f.tipo] || TIPOS_FU.como_foi).nome) + ': ' + esc(f.assunto) + '</span></span><span class="lado"><span class="status ' + esc(f.status) + '">' + esc(STATUS_FU[f.status] || f.status) + '</span></span></div>';
      if (f.status === "agendado"){
        html += '<div class="ped-acoes"><button class="btn" type="button" data-fu-editar="' + f.id + '">Alterar</button>'
          + '<button class="btn" type="button" data-fu-cancelar="' + f.id + '">Cancelar envio</button><span class="msg" id="fuMsg' + f.id + '"></span></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (!tela.fuForm){
    html += '<p class="sub" style="margin-top:14px;">Nenhum follow-up agendado ainda.</p>';
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", () => irPara(b.getAttribute("data-ir"))));
  if ($("fuNovo")) $("fuNovo").addEventListener("click", () => { tela.fuForm = { id: null, tipo: tipoInicial(), remetente: "", nome: "", assunto: "", data_envio: hojeNegocio(1) }; renderFollowup(); });
  box.querySelectorAll("[data-fu-tipo]").forEach(b => b.addEventListener("click", () => {
    const f = tela.fuForm; f.remetente = $("fuFone").value; f.nome = $("fuNome").value; f.data_envio = $("fuData").value;
    const novo = b.getAttribute("data-fu-tipo");

  }));
  if ($("fuCancelarForm")) $("fuCancelarForm").addEventListener("click", () => { tela.fuForm = null; renderFollowup(); });
  if ($("fuSalvar")) $("fuSalvar").addEventListener("click", salvarFollowup);
  if ($("fuFone")) $("fuFone").addEventListener("change", () => {
    const c = (d.clientes_recentes || []).find(x => x.remetente === $("fuFone").value.replace(/\D/g, ""));
    if (c && c.nome && !$("fuNome").value) { $("fuNome").value = c.nome; atualizarPrevia(); }

  ["fuNome", "fuAssunto"].forEach(id => { if ($(id)) $(id).addEventListener("input", atualizarPrevia); });
  box.querySelectorAll("[data-abafu]").forEach(b => b.addEventListener("click", () => { tela.abaFu = b.getAttribute("data-abafu"); renderFollowup(); }));
  box.querySelectorAll("[data-fu-editar]").forEach(b => b.addEventListener("click", () => {
    const f = todos.find(x => x.id === Number(b.getAttribute("data-fu-editar")));

  }));

function atualizarPrevia(){ if ($("fuPrevia")) $("fuPrevia").textContent = textoFollowup($("fuNome").value, $("fuAssunto").value.trim(), (tela.fuForm || {}).tipo); }

async function salvarFollowup(){
  const msg = $("fuMsg"); const btn = $("fuSalvar"); const f = tela.fuForm;
  const fone = $("fuFone").value.replace(/\D/g, "");
  const nome = $("fuNome").value.trim();
  const assunto = $("fuAssunto").value.trim().replace(/[?.!]+$/, "");
  const data = $("fuData").value;
  msg.className = "msg"; msg.textContent = "";
  const erro = fone.length < 10 || fone.length > 15 ? "Confira o WhatsApp do cliente: código do país + DDD + número."
    : assunto.length < 3 ? "Complete a mensagem (ex.: " + exemploAssunto(dadosPainel.tipo_negocio, f.tipo) + ")."
    : !data || data < hojeNegocio(0) ? "Escolha um dia de hoje em diante." : "";
  if (erro){ msg.className = "msg erro"; msg.textContent = erro; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data: r, error } = await supa.rpc("salvar_followup", { p_id: f.id, p_remetente: fone, p_nome: nome, p_assunto: assunto, p_data: data,
    p_pedido_id: f.pedido_id || null, p_agendamento_id: f.agendamento_id || null, p_tipo: f.tipo || "como_foi" });
  btn.disabled = false; btn.textContent = f.id ? "Salvar alteração" : "Agendar follow-up";
  if (error || !r || !r.ok){
    const m = String((error && error.message) || "");
    msg.className = "msg erro";
    msg.textContent = /limite/.test(m) ? "Você chegou ao limite de follow-ups deste mês do seu plano. No plano Completo não há limite."
      : /fora do plano/.test(m) ? "Esse tipo de mensagem faz parte do plano Completo."
      : "Não foi possível salvar agora. Tente de novo em alguns instantes.";
    return;
  }
  tela.fuForm = null; tela.abaFu = "agendado";
  await carregarPainel();
}

async function cancelarFollowup(btn){
  const id = Number(btn.getAttribute("data-fu-cancelar"));
  if (!confirm("Cancelar este follow-up? A mensagem não será enviada.")) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Cancelando...';
  const { data, error } = await supa.rpc("cancelar_followup", { p_id: id });
  if (error || !data || !data.ok){ btn.disabled = false; btn.textContent = "Tentar de novo"; return; }
  const f = (dadosPainel.followups || []).find(x => x.id === id);
  if (f) f.status = "cancelado";
  dadosPainel.followups_agendados = Math.max(0, Number(dadosPainel.followups_agendados || 0) - 1);
  render(dadosPainel);
}

/* ---------- Agendamentos: horários marcados pela secretária, por dia, e o dono muda o status ---------- */
function renderAgenda(){
  const d = dadosPainel;
  const box = $("agendaPainel");
  const tz = d.timezone || "America/Sao_Paulo";
  const todos = d.agendamentos || [];
  const diaDe = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
  const hojeStr = diaDe(new Date().toISOString());
  const amanhaStr = diaDe(new Date(Date.now() + 86400000).toISOString());
  const filtros = {
    proximos: (a) => diaDe(a.data_hora) >= hojeStr && a.status !== "cancelado",
    anteriores: (a) => diaDe(a.data_hora) < hojeStr && a.status !== "cancelado",
    cancelados: (a) => a.status === "cancelado",
    todos: () => true,
  };
  const nHoje = Number(d.agendamentos_hoje || 0);
  let html = '<p class="sub">' + (nHoje ? (nHoje === 1 ? '1 agendamento hoje.' : nHoje + ' agendamentos hoje.') : 'Nenhum agendamento para hoje.')
    + (Number(d.agendamentos_semana || 0) ? ' ' + d.agendamentos_semana + ' nos próximos 7 dias.' : '') + '</p>'
    + '<details class="ajuda"><summary>Como funciona?</summary>'
    + '<p>Quando um cliente marca um horário pelo WhatsApp, a secretária confere a sua agenda, confirma com ele e o agendamento aparece aqui (e no seu Google Agenda).</p>'
    + '<p>Depois do horário, marque como <b>Realizado</b> ou <b>Não compareceu</b>. Se o cliente desmarcar, marque <b>Cancelado</b> e lembre de tirar também do Google Agenda.</p>'
    + '</details>';
  if (todos.length){
    html += '<div class="sec-corpo"><div class="abas">';
    [["proximos", "Próximos"], ["anteriores", "Anteriores"], ["cancelados", "Cancelados"], ["todos", "Todos"]].forEach(([s, n]) => {
      html += '<button type="button" class="aba' + (tela.abaAg === s ? ' ativa' : '') + '" data-abaag="' + s + '">' + n + ' (' + todos.filter(filtros[s]).length + ')</button>';
    });
    html += '</div>';
    let lista = todos.filter(filtros[tela.abaAg]);
    lista = lista.slice().sort((a, b) => tela.abaAg === "proximos" ? new Date(a.data_hora) - new Date(b.data_hora) : new Date(b.data_hora) - new Date(a.data_hora));
    if (!lista.length) html += '<p class="sub" style="margin:0;">Nenhum agendamento aqui.</p>';
    let diaAtual = "";
    lista.forEach(a => {
      const dia = diaDe(a.data_hora);
      if (dia !== diaAtual){
        diaAtual = dia;
        const rot = dia === hojeStr ? "Hoje" : dia === amanhaStr ? "Amanhã"
          : new Date(a.data_hora).toLocaleDateString("pt-BR", { timeZone: tz, weekday: "short", day: "2-digit", month: "2-digit" });
        html += '<div class="dia">' + esc(rot) + '</div>';
      }
      const hora = new Date(a.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
      const aberto = tela.agendamento === a.id;
      html += '<div class="pedido ag-linha"><button type="button" class="ped-linha" data-ag="' + a.id + '">'
        + '<span style="display:flex;gap:12px;align-items:center;"><span class="hora">' + hora + '</span><span>' + esc(a.servico || "Agendamento")
        + ' <span class="quem">· ' + esc(a.nome || ("+" + a.remetente)) + '</span></span></span>'
        + '<span class="lado">' + chipAviso(a) + '<span class="status ' + esc(a.status) + '">' + esc(STATUS_AG[a.status] || a.status) + '</span>' + (aberto ? '▴' : '▾') + '</span></button>';
      if (aberto){
        const remarcavel = a.pedido_id && a.status === "confirmado" && (d.pedidos || []).some(p => p.id === a.pedido_id);
        html += '<div class="ped-detalhe"><div class="d">'
          + (a.endereco ? '<b>Endereço:</b> ' + esc(a.endereco) + '<br>' : '')
          + '<b>Data:</b> ' + esc(new Date(a.data_hora).toLocaleString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))
          + '<br><b>Contato:</b> +' + esc(a.remetente) + linhaLembrete(a) + '</div><div class="ped-acoes">'
          + '<button class="btn btn-primary" type="button" data-resp="a' + a.id + '">Falar no WhatsApp</button>'
          + (remarcavel ? '<button class="btn" type="button" data-conf="' + a.pedido_id + '">Remarcar horário</button>' : '')
          + '<button class="btn" type="button" data-fu-ag="' + a.id + '">Agendar follow-up</button>';
        Object.keys(STATUS_AG).filter(s => s !== a.status).forEach(s => {
          html += '<button class="btn" type="button" data-statusag="' + s + '" data-id="' + a.id + '">' + (s === "confirmado" ? "Voltar para confirmado" : STATUS_AG[s]) + '</button>';
        });
        html += '<span class="msg" id="agMsg' + a.id + '"></span></div>' + (tela.resp === "a" + a.id ? formResposta("a" + a.id) : '')
          + (remarcavel && tela.confHorario === a.pedido_id ? formHorario(a.pedido_id) : '') + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (d.agenda_conectada){
    html += '<p class="sub" style="margin-top:14px;">Ainda não há agendamentos. Quando a secretária marcar o primeiro horário com um cliente, ele aparece aqui.</p>';
  }
  html += blocoLembrete(d) + blocoAgenda(d);
  box.innerHTML = html;
  ligarAgenda();
  ligarHorario(box, renderAgenda);
  ligarResposta(box, renderAgenda);
  if ($("lembreteDias")) $("lembreteDias").addEventListener("change", (e) => salvarLembrete(e.target.value));
  box.querySelectorAll("[data-abaag]").forEach(b => b.addEventListener("click", () => { tela.abaAg = b.getAttribute("data-abaag"); tela.agendamento = null; renderAgenda(); }));
  box.querySelectorAll("[data-ag]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-ag")); tela.agendamento = tela.agendamento === id ? null : id; renderAgenda();
  }));
  box.querySelectorAll("[data-statusag]").forEach(b => b.addEventListener("click", () => mudarAgendamento(b)));
  box.querySelectorAll("[data-fu-ag]").forEach(b => b.addEventListener("click", () => {
    const a = (dadosPainel.agendamentos || []).find(x => x.id === Number(b.getAttribute("data-fu-ag")));
    if (a) novoFollowup({ remetente: a.remetente, nome: a.nome || "", assunto: a.servico ? "o seu " + a.servico.charAt(0).toLowerCase() + a.servico.slice(1) : "", agendamento_id: a.id });
  }));
}

/* ---------- Central de Respostas Rápidas: biblioteca de textos para a equipe responder pelo WhatsApp ----------
   Biblioteca padrão em painel/respostas.js; o que a dona muda (minhas, editadas, favoritas, escondidas) fica em
   businesses.respostas_rapidas. O texto vai pelo WhatsApp da equipe (wa.me), não pela API da Meta. */
// Editar, esconder e criar respostas: Premium, Completo e teste (sem a informação, ainda não rodou o SQL: libera).
// Perguntas frequentes por plano (planos.faq_limite), para os cartões de "Escolha seu plano".
const PERGUNTAS_POR_PLANO = { light: 5, basico: 10, premium: 30, completo: 30 };
function podeEditarRespostas(){ return respostasRapidas.pode_editar !== false; }
function semAcento(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
// Biblioteca do tipo de negócio (código do cadastro, ex.: "salao"; negócios antigos podem ter o nome escrito).
function tipoBiblioteca(){
  const B = window.RESPOSTAS_RAPIDAS || {};
  const t = semAcento(dadosPainel.tipo_negocio || "").trim();
  if (B[t]) return t;
  const regras = [[/viage|turis/, "agencia_viagens"], [/odont|dentist/, "clinica_odontologica"], [/clinic|consult|medic|psic|fisio|saude|nutri/, "clinica"],
    [/salao|beleza|barb|estetic|unha|cabel|manicure/, "salao"], [/academ|fitness|crossfit|pilates|muscula/, "academia"], [/eletric/, "eletricista"],
    [/encan|hidraul|desentup/, "encanador"], [/mecan|oficina|auto ?center|funilar/, "mecanico"], [/restaur|lanch|pizz|hamburg|comida|delivery|bar\b|cafeteria/, "restaurante"]];
  const r = regras.find(([re]) => re.test(t));
  return r && B[r[1]] ? r[1] : "geral";
}
// País da empresa (moeda e fuso do cadastro): números de emergência e respostas que só valem num país (Pix).
const FUSOS_BR = /^America\/(Sao_Paulo|Fortaleza|Recife|Bahia|Belem|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Araguaina|Maceio|Noronha|Santarem)$/;
function paisEmpresa(){
  const d = dadosPainel, tz = String(d.timezone || ""), moeda = String(d.moeda || "").toUpperCase();
  if (moeda === "BRL" || FUSOS_BR.test(tz)) return "BR";
  const porFuso = { "Europe/Lisbon": "PT", "Atlantic/Madeira": "PT", "Atlantic/Azores": "PT", "Europe/Dublin": "IE", "Europe/London": "GB",
    "Europe/Madrid": "ES", "Europe/Paris": "FR", "Europe/Rome": "IT", "Europe/Berlin": "DE", "America/Mexico_City": "MX",
    "America/Argentina/Buenos_Aires": "AR", "America/Toronto": "CA", "America/Vancouver": "CA" };
  if (porFuso[tz]) return porFuso[tz];
  if (/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage)$|^Pacific\/Honolulu$/.test(tz)) return "US";
  if (moeda === "EUR") return "EU";
  return "";
}
// Números de emergência por país; país desconhecido fica [entre colchetes] e o painel pede para completar.
function emergenciaPais(){
  const t = { BR: ["192 (SAMU)", "193 (Bombeiros)"], PT: ["112", "112"], IE: ["112 ou 999", "112 ou 999"], GB: ["999", "999"], EU: ["112", "112"],
    ES: ["112", "112"], FR: ["15 ou 112", "18 ou 112"], IT: ["118 ou 112", "115 ou 112"], DE: ["112", "112"], US: ["911", "911"], CA: ["911", "911"],
    MX: ["911", "911"], AR: ["107", "100"] }[paisEmpresa()];
  return t ? { medica: t[0], bombeiros: t[1] } : { medica: "[número de emergência local]", bombeiros: "[número dos bombeiros local]" };
}
function bibliotecaPadrao(){
  const B = window.RESPOSTAS_RAPIDAS || {};
  return B[tipoBiblioteca()] || B.geral || { categorias: [], itens: [], sugestoes: {} };
}
// Padrão (com as versões editadas pela dona) + as criadas por ela. Escondidas só quando pedido.
function bibliotecaConta(incluirEscondidas){
  const R = respostasRapidas, base = bibliotecaPadrao();
  const meus = {}; (R.meus || []).forEach(m => { meus[m.id] = m; });
  const lista = base.itens.map(m => meus[m.id] ? Object.assign({}, m, meus[m.id], { padrao: true, editado: true }) : Object.assign({ padrao: true }, m));
  (R.meus || []).filter(m => !base.itens.some(b => b.id === m.id)).forEach(m => lista.push(Object.assign({ cat: "Minhas respostas" }, m, { meu: true })));
  lista.forEach(m => { m.escondida = (R.ocultos || []).includes(m.id); m.fav = (R.favoritos || []).includes(m.id); });
  // Resposta de outro país (ex.: Pix fora do Brasil) não aparece; país desconhecido mostra tudo.
  const pais = paisEmpresa();
  const doPais = lista.filter(m => !m.pais || !pais || m.pais === pais);
  return incluirEscondidas ? doPais : doPais.filter(m => !m.escondida);
}
function categoriasConta(lista){
  const cats = bibliotecaPadrao().categorias.slice();
  lista.forEach(m => { if (m.cat && !cats.includes(m.cat)) cats.push(m.cat); });
  return cats.filter(c => lista.some(m => m.cat === c));
}
function buscarRespostas(lista, termo){
  const partes = semAcento(termo).trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return lista;
  return lista.filter(m => { const alvo = semAcento(m.titulo + " " + m.texto + " " + (m.chaves || "") + " " + m.cat); return partes.every(p => alvo.includes(p)); });
}
// Serviços que a empresa oferece (catálogo ligado + serviços do cadastro). Vazio = sem informação, não filtra.
function servicosEmpresa(){
  const d = dadosPainel;
  return semAcento((d.servicos || []).filter(x => x.ativo !== false).map(x => x.titulo).join(" ") + " " + (d.servicos_oferecidos || "")).trim();
}
// O que o painel já sabe (dados carregados) sobre a evidência exigida; a confirmação final é feita no banco na hora de enviar.
function evidenciaLocal(tipo, ctx){
  const d = dadosPainel, agora = Date.now();
  const ags = (d.agendamentos || []).filter(a => a.remetente === ctx.remetente);
  const ped = ctx.pedidoId ? (d.pedidos || []).find(x => x.id === ctx.pedidoId) : (d.pedidos || []).find(x => x.remetente === ctx.remetente);
  if (tipo === "agendamento") return ags.some(a => a.status === "confirmado" && new Date(a.data_hora).getTime() >= agora - 7200000);
  if (tipo === "realizado") return ags.some(a => a.status === "realizado" && new Date(a.data_hora).getTime() >= agora - 30 * 86400000);
  if (tipo === "fechado") return !!ped && ped.status === "fechado";
  if (tipo === "pagamento") return !!ped && !!ped.pago_em;
  return true;
}
// Sugeridas (até 3): palavras da última mensagem do cliente, etapa do pedido e o que a empresa oferece.
// Não sugere serviço que a empresa não oferece nem confirmação sem evidência no sistema.
function sugerirRespostas(lista, ctx){
  const oferece = servicosEmpresa();
  const pode = (m) => (!m.requer || !oferece || String(m.requer).split(/\s+/).some(k => k && oferece.includes(semAcento(k))))
    && (!m.evidencia || evidenciaLocal(m.evidencia, ctx));
  const nota = new Map();
  if (ctx.ultima){
    const msg = " " + semAcento(ctx.ultima).replace(/[^a-z0-9-]+/g, " ") + " ";
    lista.forEach(m => {
      const n = String(m.chaves || "").split(/\s+/).filter(k => k.length > 2 && msg.includes(" " + k)).length;
      if (n) nota.set(m.id, (nota.get(m.id) || 0) + n * 3);
    });
  }
  ((bibliotecaPadrao().sugestoes || {})[ctx.etapa] || []).forEach((id, i) => nota.set(id, (nota.get(id) || 0) + 2 - i * 0.1));
  return lista.filter(m => nota.has(m.id) && pode(m)).sort((a, b) => nota.get(b.id) - nota.get(a.id)).slice(0, 3);
}
function assuntoPedido(p){
  const dd = p.dados || {};
  const titulo = ((dadosPainel.itens || {})[p.item] || "").toLowerCase();
  return dd.destino ? "a sua viagem para " + dd.destino : dd.servico ? "o seu " + String(dd.servico).toLowerCase() : titulo ? "o seu pedido de " + titulo : "";
}
// De quem é a conversa: p<id> = pedido, a<id> = agendamento, c<telefone> = cliente esperando.
function ctxResposta(chave){
  const d = dadosPainel, tipo = String(chave || "").charAt(0), ref = String(chave || "").slice(1);
  if (tipo === "p"){ const p = (d.pedidos || []).find(x => x.id === Number(ref)) || {};
    return { remetente: p.remetente, nome: (p.dados || {}).nome, assunto: assuntoPedido(p), dados: p.dados || {}, etapa: p.status, pedidoId: p.id }; }
  if (tipo === "a"){ const a = (d.agendamentos || []).find(x => x.id === Number(ref)) || {};
    const tz = d.timezone || "America/Sao_Paulo";
    const quando = a.data_hora ? new Date(a.data_hora).toLocaleDateString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit" })
      + " às " + new Date(a.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" }) : "";
    return { remetente: a.remetente, nome: a.nome, assunto: a.servico ? "o seu " + a.servico.charAt(0).toLowerCase() + a.servico.slice(1) : "",
      dados: { servico: a.servico || "", quando, endereco: a.endereco || "" }, etapa: "agendamento", pedidoId: a.pedido_id || null }; }
  const c = (d.conversas_equipe || []).find(x => x.remetente === ref) || {};
  return { remetente: ref, nome: "", assunto: "", dados: {}, etapa: "conversa", ultima: c.ultima_mensagem || "" };
}
function quandoTexto(iso){
  const tz = dadosPainel.timezone || "America/Sao_Paulo", dt = new Date(iso);
  return dt.toLocaleDateString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit" }) + " às " + dt.toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}
// Troca as variáveis numa passada só (dado do cliente nunca vira variável). Sem o dado, vira [campo] para completar.
// ev (opcional): evidência do banco; horário e serviço de uma confirmação vêm do agendamento real, não do pedido.
function preencherModelo(texto, ctx, ev){
  const n = String(ctx.nome || "").trim().split(/\s+/)[0];
  const dd = ctx.dados || {};
  const ag = ev && (ev.agendamento || ev.realizado);
  const minusc = (x) => String(x).charAt(0).toLowerCase() + String(x).slice(1);
  const emerg = emergenciaPais();
  const v = {
    negocio: dadosPainel.nome || "[nome da empresa]",
    servico: ag && ag.servico ? minusc(ag.servico) : dd.servico ? minusc(dd.servico) : "[serviço]",
    quando: ag && ag.data_hora ? quandoTexto(ag.data_hora) : ctx.etapa === "agendamento" && dd.quando ? dd.quando : "[dia e horário]",
    endereco: ag && ag.endereco ? ag.endereco : dd.endereco || "[endereço]",
    carro: dd.carro || "carro", assunto: ctx.assunto || "o seu pedido",
    destino: dd.destino || "[destino]", datas: dd.datas || "[datas]", pessoas: dd.pessoas || "[quantas pessoas]", saida: dd.saida || "[cidade de saída]",
    reserva: "[número da reserva]", data_partida: "[data de partida]", link_pagamento: "[link de pagamento]", horario: "[horário de atendimento]",
    emergencia_medica: emerg.medica, emergencia_bombeiros: emerg.bombeiros,
  };
  let t = String(texto || "");
  t = n ? t.replace(/\{nome\}/g, "\u0000NOME\u0000")
        : t.replace(/^\{nome\},\s*(\S)/, (_, c) => c.toUpperCase()).replace(/,\s*\{nome\}/g, "").replace(/\{nome\}/g, "");
  t = t.replace(/\{([a-z_]+)\}/g, (todo, k) => Object.prototype.hasOwnProperty.call(v, k) ? v[k] : todo);
  return n ? t.split("\u0000NOME\u0000").join(n) : t;
}
// Texto escrito para um cliente vira modelo para qualquer cliente.
function textoParaModelo(texto, ctx){
  let t = String(texto || "");
  const n = String(ctx.nome || "").trim().split(/\s+/)[0];
  const dd = ctx.dados || {};
  if (n) t = t.replace(new RegExp("\\b" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g"), "{nome}");
  if (dadosPainel.nome) t = t.split(dadosPainel.nome).join("{negocio}");
  if (dd.destino) t = t.split(dd.destino).join("{destino}");
  if (dd.datas) t = t.split(dd.datas).join("{datas}");
  return t;
}
function linkWhatsApp(remetente, texto){
  return "https://wa.me/" + String(remetente || "").replace(/\D/g, "") + (texto ? "?text=" + encodeURIComponent(texto) : "");
}
async function salvarRespostasRapidas(novo){
  const antes = respostasRapidas;
  respostasRapidas = novo;
  const { data, error } = await supa.rpc("salvar_respostas_rapidas", { p_dados: novo });
  if (error || !data || !data.ok){ respostasRapidas = antes; return false; }
  respostasRapidas = Object.assign({ meus: [], favoritos: [], ocultos: [] }, data.dados || novo);
  return true;
}
function alternarFavorita(id){
  const R = respostasRapidas, fav = (R.favoritos || []).slice();
  const i = fav.indexOf(id); if (i >= 0) fav.splice(i, 1); else fav.unshift(id);
  return salvarRespostasRapidas(Object.assign({}, R, { favoritos: fav }));
}
function cartoesResposta(lista, ctx, selecionada){
  if (!lista.length) return '<p class="sub" style="margin:6px 0;">Nenhuma resposta encontrada.</p>';
  return lista.map(m => '<div class="rr-card' + (m.id === selecionada ? ' ativo' : '') + '">'
    + '<button type="button" class="rr-usar" data-usar="' + esc(m.id) + '"><b>' + esc(m.titulo) + '</b><span>' + esc(preencherModelo(m.texto, ctx).replace(/\s+/g, " ").slice(0, 140)) + '</span></button>'
    + '<button type="button" class="rr-fav' + (m.fav ? ' on' : '') + '" data-fav="' + esc(m.id) + '" title="' + (m.fav ? 'Tirar das favoritas' : 'Favoritar') + '" aria-label="' + (m.fav ? 'Tirar das favoritas' : 'Favoritar') + '">' + (m.fav ? '★' : '☆') + '</button></div>').join("");
}

    + '<div id="respTrava">' + travaResposta() + '</div>'

      + '<select id="respCatNova">' + categoriasConta(bibliotecaConta(true)).concat(["Minhas respostas"]).filter((c, i, a) => a.indexOf(c) === i).map(c => '<option>' + esc(c) + '</option>').join("") + '</select>'
      + '<button class="btn btn-primary" type="button" id="respSalvarModelo">Salvar</button></div>' : '')
    + '</div>';

const MOTIVO_EVIDENCIA = {
  agendamento: "Não há horário confirmado e futuro para este cliente no sistema. Confirme o horário (Pedidos → Confirmar horário) antes de enviar.",
  realizado: "O serviço ainda não está marcado como Realizado. Em Agendamentos, marque o horário como Realizado antes de enviar.",
  fechado: "O pedido não está como Venda fechada no sistema. Mude o status do pedido antes de enviar.",
  pagamento: "Não há pagamento registrado para este pedido. Confira que o valor caiu e clique em Registrar pagamento no pedido antes de enviar.",
};
const OK_EVIDENCIA = { agendamento: "Horário confirmado no sistema", realizado: "Serviço marcado como realizado", fechado: "Pedido com venda fechada", pagamento: "Pagamento registrado" };
function respostaSelecionada(){ return tela.respSel ? bibliotecaConta(true).find(x => x.id === tela.respSel) : null; }
// Resposta própria que afirma confirmação, pagamento ou serviço pronto também pede a checagem manual.
const AFIRMA = /confirmad|pagamento (foi )?(recebido|confirmado|aprovado)|recebemos (o seu |seu )?pagamento|est[aá] pront|conclu[ií]d|emitid/i;
// Trava: evidência no banco (quando a resposta exige) e/ou confirmação marcada pela pessoa.
function travaResposta(){
  const m = respostaSelecionada();
  if (!m) return "";
  let h = "";
  if (m.evidencia){
    const ev = tela.respEv && tela.respEv.id === m.id ? tela.respEv : null;
    if (!ev || ev.estado === "verificando") h += '<div class="rr-evid">Verificando no sistema…</div>';
    else if (ev.ok) h += '<div class="rr-evid ok">✔ ' + esc(OK_EVIDENCIA[m.evidencia]) + (ev.detalhe ? ': ' + esc(ev.detalhe) : '') + '</div>';
    else h += '<div class="rr-evid erro">✖ ' + esc(ev.motivo) + '</div>';
  }
  const conf = m.confirmar || ((m.meu || m.editado) && AFIRMA.test(m.texto) ? "o que esta mensagem afirma está registrado e conferido." : "");
  if (conf) h += '<label class="rr-trava"><input type="checkbox" id="respConfirmo"> <span><b>Antes de enviar, confirme:</b> ' + esc(conf) + '</span></label>';
  return h;
}
// Consulta o banco agora (o painel pode estar aberto há horas). Falha na consulta = não libera o envio.
async function verificarEvidencia(m, ctx, aoTerminar){
  const id = m.id;
  tela.respEv = { id, estado: "verificando" };
  let res;
  try {
    const { data, error } = await supa.rpc("verificar_evidencia", { p_remetente: ctx.remetente, p_pedido_id: ctx.pedidoId || null });
    if (error || !data || !data.ok) throw new Error("falhou");
    const ok = m.evidencia === "agendamento" ? !!data.agendamento : m.evidencia === "realizado" ? !!data.realizado
      : m.evidencia === "fechado" ? !!(data.pedido && data.pedido.status === "fechado") : m.evidencia === "pagamento" ? !!(data.pedido && data.pedido.pago_em) : false;
    const ag = data.agendamento || data.realizado;
    const detalhe = ok && (m.evidencia === "agendamento" || m.evidencia === "realizado") && ag ? (ag.servico ? ag.servico + ", " : "") + quandoTexto(ag.data_hora)
      : ok && m.evidencia === "pagamento" ? "em " + new Date(data.pedido.pago_em).toLocaleDateString("pt-BR") : "";
    res = { id, estado: "pronto", ok, motivo: ok ? "" : MOTIVO_EVIDENCIA[m.evidencia], detalhe, dados: data, em: Date.now() };
  } catch (e) {
    res = { id, estado: "pronto", ok: false, motivo: "Não foi possível verificar no sistema agora. Tente de novo em instantes.", em: Date.now() };
  }
  if (tela.respSel !== id) return;   // a pessoa já escolheu outra resposta
  tela.respEv = res;
  if (aoTerminar) aoTerminar(res);
}
// Campo por completar: [colchetes] ou {variável} que o painel não conhece.
function camposAbertos(texto){ return (String(texto || "").match(/\[[^\]\n]{1,60}\]|\{[a-zA-Z_]{1,40}\}/g) || []).filter((v, i, a) => a.indexOf(v) === i); }
function listaResposta(ctx){
  const lista = bibliotecaConta(false);
  if ((tela.respBusca || "").trim()) return '<div class="rr-lista">' + cartoesResposta(buscarRespostas(lista, tela.respBusca), ctx, tela.respSel) + '</div>';
  const sug = sugerirRespostas(lista, ctx);
  const favs = lista.filter(m => m.fav);
  const abas = (sug.length ? ["Sugeridas"] : []).concat(favs.length ? ["Favoritas"] : []).concat(categoriasConta(lista));
  if (!abas.includes(tela.respCat)) tela.respCat = abas[0];
  const itens = tela.respCat === "Sugeridas" ? sug : tela.respCat === "Favoritas" ? favs : lista.filter(m => m.cat === tela.respCat);
  return '<div class="abas rr-abas">' + abas.map(c => '<button type="button" class="aba' + (c === tela.respCat ? ' ativa' : '') + '" data-respcat="' + esc(c) + '">'
      + (c === "Sugeridas" ? '✨ ' : c === "Favoritas" ? '★ ' : '') + esc(c) + '</button>').join("") + '</div>'
    + '<div class="rr-lista">' + cartoesResposta(itens, ctx, tela.respSel) + '</div>';
}
function ligarResposta(box, redesenhar){
  box.querySelectorAll("[data-resp]").forEach(b => b.addEventListener("click", () => {
    const k = b.getAttribute("data-resp");
    tela.resp = tela.resp === k ? null : k;
    tela.respTexto = null; tela.respSalvando = false; tela.respBusca = ""; tela.respCat = null; tela.respSel = null; tela.respEv = null;
    redesenhar();
  }));
  if (!$("formResp")) return;
  const ctx = ctxResposta(tela.resp);
  const atualizar = () => { tela.respTexto = $("respTexto").value; $("respAbrir").href = linkWhatsApp(ctx.remetente, tela.respTexto); };
  const ligarLista = () => {
    $("respLista").querySelectorAll("[data-respcat]").forEach(b => b.addEventListener("click", () => { tela.respCat = b.getAttribute("data-respcat"); refazer(); }));
    $("respLista").querySelectorAll("[data-usar]").forEach(b => b.addEventListener("click", () => {
      const m = bibliotecaConta(true).find(x => x.id === b.getAttribute("data-usar"));
      if (!m) return;
      tela.respSel = m.id; tela.respEv = null; $("respTexto").value = preencherModelo(m.texto, ctx); atualizar(); refazer();
      $("respTrava").innerHTML = travaResposta(); $("respMsg").textContent = "";
      if (m.evidencia) checar(m);
      const t = $("respTexto"), i = t.value.indexOf("[");
      t.focus(); if (i >= 0){ t.setSelectionRange(i, t.value.indexOf("]", i) + 1); }
    }));
    $("respLista").querySelectorAll("[data-fav]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      if (!(await alternarFavorita(b.getAttribute("data-fav")))){ $("respMsg").className = "msg erro"; $("respMsg").textContent = "Não foi possível salvar a favorita agora."; }
      refazer();
    }));
  };
  const refazer = () => { $("respLista").innerHTML = listaResposta(ctx); ligarLista(); };
  // Verifica a evidência; se a pessoa ainda não mexeu no texto, refaz com o horário e o serviço reais do agendamento.
  const checar = (m) => {
    const antes = $("respTexto").value;
    verificarEvidencia(m, ctx, (res) => {
      if (!$("respTrava")) return;
      if (res.ok && $("respTexto").value === antes){ $("respTexto").value = preencherModelo(m.texto, ctx, res.dados); atualizar(); }
      const marcado = !!($("respConfirmo") && $("respConfirmo").checked);   // não desmarca o que a pessoa já marcou
      $("respTrava").innerHTML = travaResposta();
      if (marcado && $("respConfirmo")) $("respConfirmo").checked = true;
    });
  };
  ligarLista();
  $("respBusca").addEventListener("input", (e) => { tela.respBusca = e.target.value; refazer(); });
  $("respTexto").addEventListener("input", atualizar);
  // Não abre o WhatsApp com campo por completar, sem evidência no sistema (verificada há menos de 2 minutos) ou sem a confirmação marcada.
  $("respAbrir").addEventListener("click", (e) => {
    const msg = $("respMsg"), faltam = camposAbertos($("respTexto").value), m = respostaSelecionada();
    const bloquear = (texto) => { e.preventDefault(); msg.className = "msg erro"; msg.textContent = texto; };
    if (faltam.length){ bloquear("Complete antes de enviar: " + faltam.join(", ")); $("respTexto").focus(); return; }
    if (m && m.evidencia){
      const ev = tela.respEv && tela.respEv.id === m.id ? tela.respEv : null;
      if (!ev || ev.estado === "verificando"){ bloquear("Aguarde a verificação no sistema."); return; }
      if (!ev.ok){ bloquear(ev.motivo); return; }
      if (Date.now() - ev.em > 120000){ bloquear("Verificando de novo no sistema… clique outra vez em seguida."); checar(m); return; }
    }
    if ($("respConfirmo") && !$("respConfirmo").checked){ bloquear("Marque a confirmação acima para enviar."); return; }
    msg.textContent = "";
  });
  { const m0 = respostaSelecionada(); if (m0 && m0.evidencia && !(tela.respEv && tela.respEv.id === m0.id)) checar(m0); }
  $("respCancelar").addEventListener("click", () => { tela.resp = null; tela.respTexto = null; tela.respSalvando = false; redesenhar(); });
  if ($("respNovoModelo")) $("respNovoModelo").addEventListener("click", () => { tela.respSalvando = !tela.respSalvando; redesenhar(); if ($("respTitulo")) $("respTitulo").focus(); });
  if ($("respSalvarModelo")) $("respSalvarModelo").addEventListener("click", async () => {
    const titulo = $("respTitulo").value.trim(), texto = $("respTexto").value.trim();
    const msg = $("respMsg"); msg.className = "msg erro";
    if (!titulo){ msg.textContent = "Dê um nome à resposta."; return; }
    if (!texto){ msg.textContent = "Escreva o texto."; return; }
    const R = respostasRapidas;
    if ((R.meus || []).length >= 80){ msg.textContent = "Limite de respostas atingido. Apague uma para salvar outra."; return; }
    const nova = { id: "m" + Date.now().toString(36), cat: $("respCatNova").value, titulo, texto: textoParaModelo(texto, ctx) };
    msg.className = "msg"; msg.textContent = "Salvando...";
    if (!(await salvarRespostasRapidas(Object.assign({}, R, { meus: (R.meus || []).concat([nova]) })))){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo."; return; }
    tela.respSalvando = false; tela.respCat = nova.cat; tela.respSel = nova.id;
    redesenhar();
    if ($("respMsg")){ $("respMsg").className = "msg ok"; $("respMsg").textContent = "Resposta salva ✓"; }
  });
}
