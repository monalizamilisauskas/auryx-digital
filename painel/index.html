<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auryx — Painel da AI Secretária</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    /* Azul-marinho com destaque azul. Os nomes antigos (gold, parchment) ficaram para não mexer no resto do CSS. */
    --ink:#0B1220; --panel:#0F172A; --panel-2:#131D33; --panel-3:#18233B;
    --line: rgba(148,163,184,0.14); --line-strong: rgba(96,165,250,0.40);
    --gold:#2563EB; --gold-bright:#60A5FA; --parchment:#E2E8F0; --muted:#94A3B8;
    --good:#34D399; --bad:#F87171; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--ink);
    color:var(--parchment); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  a{color:inherit;}
  .wrap{ max-width:1000px; margin:0 auto; padding:0 clamp(20px,5vw,48px); width:100%; }

  nav.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px clamp(20px,5vw,48px); border-bottom:1px solid var(--line);
  }
  .brand-mark{ height:34px; width:auto; }
  .btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 22px; border-radius:22px; cursor:pointer; border:1px solid var(--line-strong);
    background:transparent; color:var(--parchment); transition:.2s border-color, .2s background;
  }
  .btn:hover{ border-color:var(--gold); }
  .btn-primary{ background:var(--gold); color:#fff; border:1px solid var(--gold); box-shadow:0 6px 18px -8px rgba(37,99,235,0.7); }
  .btn-primary:hover{ background:#1D4ED8; border-color:#1D4ED8; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }

  /* ---------- Login screen ---------- */
  .login-card{
    max-width:400px; width:100%; border:1px solid var(--line); border-radius:14px; padding:40px 34px;
    background:var(--panel);
  }
  .login-card .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; color:var(--gold);
    text-transform:uppercase; margin:0 0 12px; display:flex; align-items:center; gap:10px;
  }
  .login-card .eyebrow::before{ content:''; width:20px; height:1px; background:var(--gold); }
  .login-card h1{ font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0 0 8px; }
  .login-card .sub{ color:var(--muted); font-size:14px; margin:0 0 30px; line-height:1.5; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:500; margin-bottom:7px; color:var(--parchment); }
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--parchment);
    border-radius:8px; padding:12px 14px; font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{ outline:none; border-color:var(--gold); background:var(--panel-3); }
  .login-card .btn{ width:100%; text-align:center; padding:13px; font-size:14.5px; margin-top:6px; }
  .error-msg{
    background:rgba(185,112,94,0.1); border:1px solid rgba(185,112,94,0.3); color:var(--bad);
    border-radius:8px; padding:11px 14px; font-size:13px; margin-bottom:18px; display:none;
  }
  .error-msg.show{ display:block; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(0,0,0,0.25); border-top-color:#1a1608; border-radius:50%;
    display:inline-block; vertical-align:middle; margin-right:8px; animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Dashboard screen ---------- */
  .dash{ display:none; }
  body.modo-painel nav.topbar{ display:none; }
  body.modo-painel main{ display:block; padding:0; }
  .dash.show{ display:block; min-height:100vh; }
  .side{ position:fixed; inset:0 auto 0 0; width:250px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:20; transition:transform .2s; }
  .side-topo{ display:flex; align-items:center; gap:10px; padding:20px 20px 18px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
  .side-logo{ height:30px; width:auto; }
  .menu{ display:flex; flex-direction:column; gap:2px; padding:14px 10px; flex:1; overflow-y:auto; }
  .menu button{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; background:transparent; border:none;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; padding:11px 12px; border-radius:8px; transition:.15s background, .15s color; }
  .menu button svg{ flex:none; }
  .menu button .nome{ flex:1; }
  .menu button:hover{ color:var(--parchment); background:var(--panel-2); }
  .menu button.ativo{ color:#fff; background:rgba(37,99,235,0.18); }
  .menu button.ativo svg{ color:var(--gold-bright); }
  .side-pe{ border-top:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .side-negocio{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-sair{ padding:7px 14px; font-size:12.5px; }
  .side-fundo{ display:none; }
  .conteudo{ margin-left:250px; min-height:100vh; }
  .cab{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:14px 28px; background:rgba(11,18,32,0.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .cab-menu{ display:none; background:none; border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:7px; cursor:pointer; }
  .cab-titulo{ flex:1; min-width:0; }
  .cab-titulo .t{ font-size:18px; font-weight:600; }
  .cab-titulo .s{ font-size:13.5px; color:var(--muted); margin-top:2px; }
  .cab-dir{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:rgba(37,99,235,0.22); color:var(--gold-bright); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; }
  .avatar:empty{ display:none; }
  .quem{ font-size:14px; font-weight:500; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .area{ padding:24px 28px 40px; max-width:1240px; }
  .aviso{ display:flex; align-items:flex-start; gap:12px; border-radius:12px; padding:16px 18px; margin-bottom:16px; border:1px solid; }
  .aviso svg{ flex:none; margin-top:2px; }
  .aviso .txt{ flex:1; font-size:14px; line-height:1.5; }
  .aviso .txt b{ display:block; font-weight:600; margin-bottom:2px; }
  .aviso.info{ background:rgba(37,99,235,0.10); border-color:rgba(37,99,235,0.35); color:#BFDBFE; }
  .aviso.atencao{ background:rgba(245,158,11,0.08); border-color:rgba(245,158,11,0.45); color:#FCD34D; }
  .aviso .btn{ flex:none; padding:9px 16px; font-size:13px; }
  .cartoes{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
  .cartao{ text-align:left; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:18px 20px; color:var(--parchment); font-family:'Inter',sans-serif; }
  button.cartao{ cursor:pointer; }
  button.cartao:hover{ border-color:var(--line-strong); }
  .cartao .l{ color:var(--muted); font-size:14px; }
  .cartao .n{ font-size:30px; font-weight:700; margin-top:8px; }
  .cartao .n small{ font-size:14px; font-weight:500; color:var(--muted); margin-left:4px; }
  .cartao .x{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .cartao.destaque{ background:var(--gold); border-color:var(--gold); }
  .cartao.destaque .l, .cartao.destaque .x, .cartao.destaque .n small{ color:rgba(255,255,255,0.85); }
  .cartao .barra{ height:6px; border-radius:4px; background:rgba(255,255,255,0.25); margin-top:12px; overflow:hidden; }
  .cartao .barra div{ height:100%; background:#fff; }
  .cartao .n.alerta{ color:var(--gold-bright); }
  @media (max-width:1000px){ .cartoes{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:900px){
    .side{ transform:translateX(-100%); }
    .side.aberta{ transform:none; box-shadow:0 0 40px rgba(0,0,0,0.6); }
    .side-fundo.aberta{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:15; }
    .conteudo{ margin-left:0; }
    .cab{ padding:12px 16px; }
    .cab-menu{ display:inline-flex; }
    .quem, .cab-dir .badge{ display:none; }
    .area{ padding:18px 16px 32px; }
    .aviso{ flex-wrap:wrap; }
  }
  @media (max-width:480px){ .cartoes{ grid-template-columns:minmax(0,1fr); } }
  .dash-head{ margin-bottom:36px; }
  .dash-head .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; color:var(--gold);
    text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:10px;
  }
  .dash-head .eyebrow::before{ content:''; width:20px; height:1px; background:var(--gold); }
  .dash-head h1{ font-family:'Fraunces', serif; font-weight:500; font-size:30px; margin:0 0 8px; }
  .dash-head .sub{ color:var(--muted); font-size:14.5px; }

  .metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  @media (max-width:760px){ .metric-grid{ grid-template-columns:repeat(2,1fr); } }
  .metric-card{ background:var(--panel); padding:26px 22px; }
  .metric-card .label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; margin-bottom:14px; }
  .metric-card .value{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; color:var(--gold-bright); }
  .metric-card .value.neutral{ color:var(--parchment); }
  .metric-card .value .unit{ font-size:16px; color:var(--muted); font-weight:400; margin-left:4px; }

  .period-note{ text-align:center; color:var(--muted); font-size:13px; margin-top:8px; }

  .empty-state{
    text-align:center; padding:60px 30px; border:1px dashed var(--line-strong); border-radius:12px; color:var(--muted);
  }
  .empty-state p{ font-size:14.5px; line-height:1.6; max-width:44ch; margin:0 auto; }

  .refresh-row{ display:flex; justify-content:flex-end; margin-top:20px; }
  .refresh-row .btn{ font-size:12.5px; padding:9px 18px; }

  .link-btn{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; margin-top:16px; text-decoration:underline; font-family:'Inter',sans-serif; }
  .link-btn:hover{ color:var(--parchment); }
  .ok-msg{ background:rgba(124,184,143,0.1); border:1px solid rgba(124,184,143,0.3); color:var(--good); border-radius:8px; padding:11px 14px; font-size:13px; margin-bottom:18px; display:none; }
  .ok-msg.show{ display:block; }
  .badge{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--line-strong); border-radius:20px; padding:4px 10px; margin-left:10px; vertical-align:middle; }
  .panel{ border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:24px 22px; margin-bottom:20px; }
  .panel h2{ font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:0 0 6px; }
  .panel .sub{ color:var(--muted); font-size:13.5px; margin:0 0 16px; line-height:1.5; }
  .usage-bar{ height:10px; background:var(--panel-3); border-radius:6px; overflow:hidden; margin:12px 0 8px; }
  .usage-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); width:0; transition:width .6s; }
  .usage-fill.alto{ background:linear-gradient(90deg, #c98a27, var(--bad)); }
  .usage-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted); }
  .usage-row strong{ color:var(--parchment); font-size:15px; }
  .planos{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
  @media (max-width:700px){ .planos{ grid-template-columns:1fr; } }
  .plano{ border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--panel-2); }
  .plano .n{ font-family:'Fraunces',serif; font-size:17px; margin-bottom:4px; }
  .plano .p{ color:var(--gold-bright); font-weight:600; margin-bottom:4px; }
  .plano .l{ color:var(--muted); font-size:12.5px; margin-bottom:12px; }
  .plano .btn{ width:100%; text-align:center; display:block; text-decoration:none; padding:9px; font-size:13px; }
  .pedido{ border-top:1px solid var(--line); padding:14px 0; }
  .pedido:first-child{ border-top:none; padding-top:0; }
  .pedido .t{ display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-bottom:6px; }
  .pedido .t span{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .pedido .d{ color:var(--muted); font-size:13px; line-height:1.6; }
  .pedido .d b{ color:var(--parchment); font-weight:500; }
  .pedido a{ color:var(--gold-bright); font-size:12.5px; }
  .faq-row{ position:relative; border:1px solid var(--line); border-radius:10px; padding:12px 40px 12px 12px; margin-bottom:12px; background:var(--panel-2); }
  .faq-row input, .faq-row textarea{ width:100%; background:var(--panel-3); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; }
  .faq-row textarea{ min-height:64px; margin-top:8px; resize:vertical; }
  .faq-row input:focus, .faq-row textarea:focus{ outline:none; border-color:var(--gold); }
  .faq-del{ position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .faq-del:hover{ color:var(--bad); }
  .servicos{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:8px 0 6px; }
  @media (max-width:600px){ .servicos{ grid-template-columns:1fr; } }
  .servico{ display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:var(--panel-2); font-size:14px; cursor:pointer; }
  .servico input{ accent-color:var(--gold); width:16px; height:16px; }
  .subtitulo{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; }
  .acoes{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:18px; }
  .acoes .msg{ font-size:13px; }
  .acoes .msg.ok{ color:var(--good); } .acoes .msg.erro{ color:var(--bad); }
  .bloqueado{ color:var(--muted); font-size:14px; line-height:1.6; }
  .conv{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; border-top:1px solid var(--line); padding:14px 0; }
  .conv:first-child{ border-top:none; padding-top:0; }
  .conv .info{ font-size:14px; }
  .conv .info span{ display:block; color:var(--muted); font-size:13px; margin-top:4px; }
  .conv .botoes{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sec-head{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .sec-head h2{ margin:0; }
  .sec-head .sub{ margin:6px 0 0; }
  .contador{ display:inline-block; min-width:22px; padding:2px 8px; margin-left:8px; border-radius:999px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; text-align:center; vertical-align:middle; background:var(--panel-3); color:var(--muted); border:1px solid var(--line); }
  .contador.alerta{ background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600; }
  .sec-corpo{ margin-top:18px; }
  .ajuda{ margin-top:8px; font-size:13px; color:var(--muted); line-height:1.55; max-width:640px; }
  .ajuda summary{ cursor:pointer; color:var(--gold-bright); font-size:13px; width:max-content; }
  .ajuda p{ margin:8px 0 0; }
  .ajuda ul{ margin:6px 0 0; padding-left:18px; }
  .campo{ margin-bottom:16px; }
  .campo label{ display:block; font-size:13px; color:var(--parchment); margin-bottom:6px; }
  .campo input{ width:100%; background:var(--panel-3); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; }
  .campo input:focus{ outline:none; border-color:var(--gold); }
  .campo small{ display:block; color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.5; }
  .ajuda b{ color:var(--parchment); font-weight:500; }
  .abas{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .aba{ font-family:'Inter',sans-serif; font-size:13px; padding:7px 12px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--line); }
  .aba.ativa{ color:#fff; border-color:var(--gold); background:rgba(37,99,235,0.18); }
  .ped-linha{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; cursor:pointer;
    background:transparent; border:none; color:var(--parchment); font-family:'Inter',sans-serif; font-size:14px; padding:0; }
  .ped-linha .quem{ color:var(--muted); font-size:13px; }
  .ped-linha .lado{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .status{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid var(--line); }
  .status.pendente{ color:var(--gold-bright); border-color:var(--line-strong); }
  .status.respondido{ color:var(--parchment); }
  .status.fechado{ color:var(--good); border-color:rgba(124,184,143,0.4); }
  .status.nao_fechou{ color:var(--muted); }
  .ped-detalhe{ margin-top:10px; }
  .ped-acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .ped-acoes .btn{ font-size:12.5px; padding:7px 12px; }
  .mais{ margin-top:14px; }
  .ped-acoes .msg{ font-size:13px; color:var(--bad); }
  a.btn{ text-decoration:none; display:inline-block; }
  .pedido a.btn-primary, .conv .botoes a.btn-primary{ color:#fff; font-size:12.5px; }
  .conv .botoes a{ color:var(--gold-bright); font-size:13px; }
  .conv .btn{ padding:8px 16px; font-size:12.5px; }
  /* Visual novo: tudo em Inter, cantos menos arredondados nos botões. */
  .btn{ border-radius:8px; }
  .spinner{ border-color:rgba(255,255,255,0.3); border-top-color:#fff; }
  .panel h2, .login-card h1, .plano .n{ font-family:'Inter',sans-serif; font-weight:600; letter-spacing:-0.01em; }
  .panel h2{ font-size:17px; }
  .metric-card .value{ font-family:'Inter',sans-serif; font-weight:700; font-size:30px; }
  .plano .n, .atalho .n{ font-family:'Inter',sans-serif; font-weight:600; }
  .metric-card .label, .subtitulo, .badge, .contador, .status{ font-family:'Inter',sans-serif; letter-spacing:0; }
  .metric-card .label{ text-transform:none; font-size:13.5px; }
  .badge{ text-transform:none; font-size:12px; color:var(--gold-bright); }
  .status{ text-transform:none; font-size:12px; }
  .status.pendente{ color:#FCD34D; border-color:rgba(245,158,11,0.45); }
  .status.confirmado{ color:var(--gold-bright); border-color:rgba(96,165,250,0.45); }
  .status.realizado{ color:var(--good); border-color:rgba(52,211,153,0.4); }
  .status.cancelado{ color:var(--muted); }
  .status.nao_compareceu{ color:#FCD34D; border-color:rgba(245,158,11,0.45); }
  .dia{ font-size:12.5px; font-weight:600; color:var(--gold-bright); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 6px; }
  .dia:first-child{ margin-top:0; }
  .ag-linha .hora{ font-weight:700; font-size:15px; min-width:52px; color:var(--parchment); }
  .ag-linha .quem{ color:var(--muted); font-size:13px; }
  .status.agendado{ color:var(--gold-bright); border-color:rgba(96,165,250,0.45); }

<script>

function aviso(id, msg){ const el = $(id); el.textContent = msg; el.classList.toggle("show", !!msg); }

async function carregarPainel(){
  const content = $("dashContent");
  content.innerHTML = '<div class="empty-state"><p>Carregando…</p></div>';
  const { data, error } = await supa.rpc("get_painel");
  if (error){
    content.innerHTML = '<div class="empty-state"><p>Não conseguimos carregar seus dados agora. Tente atualizar em alguns instantes ou fale com a gente em hello@auryx.digital.</p></div>';

  }
  const { data: u } = await supa.auth.getUser();

  try { const r = await supa.rpc("get_respostas_prontas"); respostasProntas = (!r.error && Array.isArray(r.data)) ? r.data : []; } catch (e) { respostasProntas = []; }
  emailLogado = (u && u.user && u.user.email) || "";

}

function render(d){
  dadosPainel = d;
  const nomeDono = String(d.contato_nome || "").trim();
  const primeiroNome = nomeDono.split(/\s+/)[0];
  const iniciais = (nomeDono || d.nome || "").split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join("");

  $("avatar").textContent = iniciais;
  $("quemNome").textContent = nomeDono || d.nome || "";
  $("sideNegocio").textContent = d.nome || "";
  const emTeste = d.plano_id === "trial";

  const menu = [
    ["inicio", "Início", 0],
    ["conversas", "Clientes esperando", convs.length],

  menu.push(["followup", "Follow-up", 0]);

    ["personalizar", "Personalizar" + (d.pode_personalizar ? "" : " 🔒"), 0],

    ["plano", emTeste ? "Escolher plano" : "Plano", 0]);
  if (!menu.some(m => m[0] === tela.view)) tela.view = "inicio";

  const titulos = {

  // Avisos no topo (como faixas): cliente esperando (amarelo) e teste grátis (azul).

    avisos += '<div class="aviso atencao">' + icone("alerta") + '<div class="txt"><b>' + (convs.length === 1 ? '1 cliente esperando atendimento' : convs.length + ' clientes esperando atendimento') + '</b>'

  }

    + '<p>Toque no pedido para ver os detalhes e clique em <b>Responder no WhatsApp</b> para mandar a proposta. Depois mude o status: '

    [["pendente", "Pendentes"], ["respondido", "Respondidos"], ["fechado", "Vendas fechadas"], ["nao_fechou", "Não fecharam"], ["todos", "Todos"]].forEach(([s, n]) => {
      html += '<button type="button" class="aba' + (tela.aba === s ? ' ativa' : '') + '" data-aba="' + s + '">' + n + ' (' + (s === "pendente" ? pend : conta(s)) + ')</button>';

          + (agP ? '<br><b>Horário confirmado:</b> ' + esc(quandoBR(agP.data_hora)) : '') + '</div><div class="ped-acoes">'
          + '<button class="btn btn-primary" type="button" data-resp="p' + p.id + '">Responder no WhatsApp</button>';
        html += '<button class="btn" type="button" data-conf="' + p.id + '">' + (agP ? 'Remarcar horário' : 'Confirmar horário') + '</button>';
        html += '<button class="btn" type="button" data-fu-ped="' + p.id + '">Agendar follow-up</button>';

  }));
}

/* ---------- Follow-up: o dono escolhe o dia e a secretária manda "Como foi ___?" ---------- */
function exemploAssunto(tipoNegocio, tipo){
  const t = String(tipoNegocio || "").toLowerCase();
  const ex = /viage|turis/.test(t) ? ["a sua viagem para Miami", "a sua última viagem", "a sua viagem para Miami"]
    : /sal[aã]o|beleza|barb|cabel|est[eé]tica|unha/.test(t) ? ["o seu corte e escova", "o seu último corte", "o seu corte e escova"]
    : /cl[ií]nica|consult|odont|sa[uú]de|m[eé]dic|psic|fisio/.test(t) ? ["a sua consulta", "a sua última consulta", "a sua consulta"]
    : /el[eé]tric|encan|hidr|reform|manuten|constru/.test(t) ? ["a instalação do chuveiro", "a última revisão elétrica da sua casa", "a instalação do chuveiro"]
    : /oficina|mec[aâ]n|auto|carro/.test(t) ? ["a revisão do seu carro", "a última revisão do seu carro", "a revisão do seu carro"]
    : ["o serviço que fizemos para você", "o seu último atendimento", "o seu atendimento"];
  return ex[{ como_foi: 0, retorno: 1, agradecimento: 2 }[tipo || "como_foi"] || 0];
}
function textoFollowup(nome, assunto, tipo){
  const n = String(nome || "").trim().split(/\s+/)[0];
  const T = TIPOS_FU[tipo || "como_foi"] || TIPOS_FU.como_foi;
  return "Olá" + (n ? ", " + n : "") + "! Aqui é da equipe " + (dadosPainel.nome || "sua empresa") + T.abertura + T.antes + (assunto || "___") + T.depois;
}
// Tipos liberados no plano (vazio = plano antigo sem a coluna: libera "Como foi").
function tiposDoPlano(){ const t = (dadosPainel && dadosPainel.followup_tipos) || []; return t.length ? t : ["como_foi"]; }
function tipoInicial(){ return tiposDoPlano()[0]; }
function limiteAtingido(){ const d = dadosPainel; return d.followup_limite_mes != null && Number(d.followups_mes || 0) >= Number(d.followup_limite_mes); }
function hojeNegocio(dias){
  const tz = dadosPainel.timezone || "America/Sao_Paulo";
  return new Date(Date.now() + (dias || 0) * 86400000).toLocaleDateString("en-CA", { timeZone: tz });
}

  const erro = fone.length < 10 || fone.length > 15 ? "Confira o WhatsApp do cliente: código do país + DDD + número."
    : assunto.length < 3 ? "Complete a mensagem (ex.: " + exemploAssunto(dadosPainel.tipo_negocio, f.tipo) + ")."
    : !data || data < hojeNegocio(0) ? "Escolha um dia de hoje em diante." : "";
  if (erro){ msg.className = "msg erro"; msg.textContent = erro; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data: r, error } = await supa.rpc("salvar_followup", { p_id: f.id, p_remetente: fone, p_nome: nome, p_assunto: assunto, p_data: data,
    p_pedido_id: f.pedido_id || null, p_agendamento_id: f.agendamento_id || null, p_tipo: f.tipo || "como_foi" });
  btn.disabled = false; btn.textContent = f.id ? "Salvar alteração" : "Agendar follow-up";
  if (error || !r || !r.ok){
    const m = String((error && error.message) || "");
    msg.className = "msg erro";
    msg.textContent = /limite/.test(m) ? "Você chegou ao limite de follow-ups deste mês do seu plano. No plano Completo não há limite."
      : /fora do plano/.test(m) ? "Esse tipo de mensagem faz parte do plano Completo."
      : "Não foi possível salvar agora. Tente de novo em alguns instantes.";
    return;
  }
  tela.fuForm = null; tela.abaFu = "agendado";
  await carregarPainel();
}

async function cancelarFollowup(btn){
  const id = Number(btn.getAttribute("data-fu-cancelar"));
  if (!confirm("Cancelar este follow-up? A mensagem não será enviada.")) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Cancelando...';
  const { data, error } = await supa.rpc("cancelar_followup", { p_id: id });
  if (error || !data || !data.ok){ btn.disabled = false; btn.textContent = "Tentar de novo"; return; }
  const f = (dadosPainel.followups || []).find(x => x.id === id);
  if (f) f.status = "cancelado";
  dadosPainel.followups_agendados = Math.max(0, Number(dadosPainel.followups_agendados || 0) - 1);
  render(dadosPainel);
}

/* ---------- Agendamentos: horários marcados pela secretária, por dia, e o dono muda o status ---------- */
function renderAgenda(){
  const d = dadosPainel;
  const box = $("agendaPainel");
  const tz = d.timezone || "America/Sao_Paulo";
  const todos = d.agendamentos || [];
  const diaDe = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
  const hojeStr = diaDe(new Date().toISOString());
  const amanhaStr = diaDe(new Date(Date.now() + 86400000).toISOString());
  const filtros = {
    proximos: (a) => diaDe(a.data_hora) >= hojeStr && a.status !== "cancelado",
    anteriores: (a) => diaDe(a.data_hora) < hojeStr && a.status !== "cancelado",
    cancelados: (a) => a.status === "cancelado",
    todos: () => true,
  };
  const nHoje = Number(d.agendamentos_hoje || 0);
  let html = '<p class="sub">' + (nHoje ? (nHoje === 1 ? '1 agendamento hoje.' : nHoje + ' agendamentos hoje.') : 'Nenhum agendamento para hoje.')
    + (Number(d.agendamentos_semana || 0) ? ' ' + d.agendamentos_semana + ' nos próximos 7 dias.' : '') + '</p>'
    + '<details class="ajuda"><summary>Como funciona?</summary>'
    + '<p>Quando um cliente marca um horário pelo WhatsApp, a secretária confere a sua agenda, confirma com ele e o agendamento aparece aqui (e no seu Google Agenda).</p>'
    + '<p>Depois do horário, marque como <b>Realizado</b> ou <b>Não compareceu</b>. Se o cliente desmarcar, marque <b>Cancelado</b> e lembre de tirar também do Google Agenda.</p>'
    + '</details>';
  if (todos.length){
    html += '<div class="sec-corpo"><div class="abas">';
    [["proximos", "Próximos"], ["anteriores", "Anteriores"], ["cancelados", "Cancelados"], ["todos", "Todos"]].forEach(([s, n]) => {
      html += '<button type="button" class="aba' + (tela.abaAg === s ? ' ativa' : '') + '" data-abaag="' + s + '">' + n + ' (' + todos.filter(filtros[s]).length + ')</button>';
    });
    html += '</div>';
    let lista = todos.filter(filtros[tela.abaAg]);
    lista = lista.slice().sort((a, b) => tela.abaAg === "proximos" ? new Date(a.data_hora) - new Date(b.data_hora) : new Date(b.data_hora) - new Date(a.data_hora));
    if (!lista.length) html += '<p class="sub" style="margin:0;">Nenhum agendamento aqui.</p>';
    let diaAtual = "";
    lista.forEach(a => {
      const dia = diaDe(a.data_hora);
      if (dia !== diaAtual){
        diaAtual = dia;
        const rot = dia === hojeStr ? "Hoje" : dia === amanhaStr ? "Amanhã"
          : new Date(a.data_hora).toLocaleDateString("pt-BR", { timeZone: tz, weekday: "short", day: "2-digit", month: "2-digit" });
        html += '<div class="dia">' + esc(rot) + '</div>';
      }
      const hora = new Date(a.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
      const aberto = tela.agendamento === a.id;
      html += '<div class="pedido ag-linha"><button type="button" class="ped-linha" data-ag="' + a.id + '">'
        + '<span style="display:flex;gap:12px;align-items:center;"><span class="hora">' + hora + '</span><span>' + esc(a.servico || "Agendamento")
        + ' <span class="quem">· ' + esc(a.nome || ("+" + a.remetente)) + '</span></span></span>'
        + '<span class="lado">' + chipAviso(a) + '<span class="status ' + esc(a.status) + '">' + esc(STATUS_AG[a.status] || a.status) + '</span>' + (aberto ? '▴' : '▾') + '</span></button>';
      if (aberto){
        const remarcavel = a.pedido_id && a.status === "confirmado" && (d.pedidos || []).some(p => p.id === a.pedido_id);
        html += '<div class="ped-detalhe"><div class="d">'
          + (a.endereco ? '<b>Endereço:</b> ' + esc(a.endereco) + '<br>' : '')
          + '<b>Data:</b> ' + esc(new Date(a.data_hora).toLocaleString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))
          + '<br><b>Contato:</b> +' + esc(a.remetente) + linhaLembrete(a) + '</div><div class="ped-acoes">'
          + '<button class="btn btn-primary" type="button" data-resp="a' + a.id + '">Falar no WhatsApp</button>'
          + (remarcavel ? '<button class="btn" type="button" data-conf="' + a.pedido_id + '">Remarcar horário</button>' : '')
          + '<button class="btn" type="button" data-fu-ag="' + a.id + '">Agendar follow-up</button>';
        Object.keys(STATUS_AG).filter(s => s !== a.status).forEach(s => {
          html += '<button class="btn" type="button" data-statusag="' + s + '" data-id="' + a.id + '">' + (s === "confirmado" ? "Voltar para confirmado" : STATUS_AG[s]) + '</button>';
        });
        html += '<span class="msg" id="agMsg' + a.id + '"></span></div>' + (tela.resp === "a" + a.id ? formResposta("a" + a.id) : '')
          + (remarcavel && tela.confHorario === a.pedido_id ? formHorario(a.pedido_id) : '') + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (d.agenda_conectada){
    html += '<p class="sub" style="margin-top:14px;">Ainda não há agendamentos. Quando a secretária marcar o primeiro horário com um cliente, ele aparece aqui.</p>';
  }
  html += blocoLembrete(d) + blocoAgenda(d);
  box.innerHTML = html;
  ligarAgenda();
  ligarHorario(box, renderAgenda);
  ligarResposta(box, renderAgenda);
  if ($("lembreteDias")) $("lembreteDias").addEventListener("change", (e) => salvarLembrete(e.target.value));
  box.querySelectorAll("[data-abaag]").forEach(b => b.addEventListener("click", () => { tela.abaAg = b.getAttribute("data-abaag"); tela.agendamento = null; renderAgenda(); }));
  box.querySelectorAll("[data-ag]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-ag")); tela.agendamento = tela.agendamento === id ? null : id; renderAgenda();
  }));
  box.querySelectorAll("[data-statusag]").forEach(b => b.addEventListener("click", () => mudarAgendamento(b)));
  box.querySelectorAll("[data-fu-ag]").forEach(b => b.addEventListener("click", () => {
    const a = (dadosPainel.agendamentos || []).find(x => x.id === Number(b.getAttribute("data-fu-ag")));
    if (a) novoFollowup({ remetente: a.remetente, nome: a.nome || "", assunto: a.servico ? "o seu " + a.servico.charAt(0).toLowerCase() + a.servico.slice(1) : "", agendamento_id: a.id });
  }));
}

/* ---------- Respostas prontas: a dona escolhe um modelo, ajusta e abre o WhatsApp com o texto escrito ---------- */
function assuntoPedido(p){
  const dd = p.dados || {};
  const titulo = ((dadosPainel.itens || {})[p.item] || "").toLowerCase();
  return dd.destino ? "a sua viagem para " + dd.destino : dd.servico ? "o seu " + String(dd.servico).toLowerCase() : titulo ? "o seu pedido de " + titulo : "";
}
function modelosPadrao(){
  const viagem = /viage|turis/i.test(String(dadosPainel.tipo_negocio || ""));
  const ola = "Olá{nome}! Aqui é da equipe {negocio}. ";
  if (viagem) return [
    { titulo: "Proposta", texto: ola + "Preparei a proposta para {assunto}:\n\n[valores, datas e condições]\n\nQualquer dúvida, estou à disposição!" },
    { titulo: "Preciso de mais informações", texto: ola + "Para montar a melhor opção para {assunto}, preciso de mais alguns detalhes:\n\n[o que falta saber]" },
    { titulo: "Sem disponibilidade", texto: ola + "Infelizmente não encontramos disponibilidade para {assunto} do jeito que você pediu. Posso te sugerir outras datas ou opções?" },
    { titulo: "Acompanhar proposta", texto: ola + "Passando para saber se você conseguiu ver a proposta para {assunto}. Ficou alguma dúvida?" },
    { titulo: "Pagamento", texto: ola + "Para garantir {assunto}, seguem os dados para pagamento:\n\n[link ou dados de pagamento]\n\nAssim que o pagamento for confirmado, eu te aviso por aqui." },
  ];
  return [
    { titulo: "Orçamento", texto: ola + "Preparei o orçamento para {assunto}:\n\n[valores e condições]\n\nQualquer dúvida, estou à disposição!" },
    { titulo: "Preciso de mais informações", texto: ola + "Para te passar o orçamento de {assunto}, preciso de mais alguns detalhes:\n\n[o que falta saber]" },
    { titulo: "Horários disponíveis", texto: ola + "Para {assunto}, tenho estes horários disponíveis:\n\n[dias e horários]\n\nQual fica melhor para você?" },
    { titulo: "Acompanhar orçamento", texto: ola + "Passando para saber se você conseguiu ver o orçamento de {assunto}. Ficou alguma dúvida?" },
  ];
}
// De quem é a conversa: p<id> = pedido, a<id> = agendamento, c<telefone> = cliente esperando.
function ctxResposta(chave){
  const d = dadosPainel, tipo = chave.charAt(0), ref = chave.slice(1);
  if (tipo === "p"){ const p = (d.pedidos || []).find(x => x.id === Number(ref)) || {}; return { remetente: p.remetente, nome: (p.dados || {}).nome, assunto: assuntoPedido(p) }; }
  if (tipo === "a"){ const a = (d.agendamentos || []).find(x => x.id === Number(ref)) || {};
    return { remetente: a.remetente, nome: a.nome, assunto: a.servico ? "o seu " + a.servico.charAt(0).toLowerCase() + a.servico.slice(1) : "" }; }
  return { remetente: ref, nome: "", assunto: "" };
}
function preencherModelo(texto, ctx){
  const n = String(ctx.nome || "").trim().split(/\s+/)[0];
  return String(texto)
    .replace(/\{nome\}/g, n ? ", " + n : "")
    .replace(/\{negocio\}/g, dadosPainel.nome || "")
    .replace(/\{assunto\}/g, ctx.assunto || "o seu pedido");
}
function todosModelos(){
  return modelosPadrao().map(m => Object.assign({ meu: false }, m)).concat((respostasProntas || []).map((m, i) => Object.assign({ meu: true, i }, m)));
}
function linkWhatsApp(remetente, texto){
  return "https://wa.me/" + String(remetente || "").replace(/\D/g, "") + (texto ? "?text=" + encodeURIComponent(texto) : "");
}
function formResposta(chave){
  const ctx = ctxResposta(chave);
  const modelos = todosModelos();
  if (tela.respTexto == null) tela.respTexto = modelos.length ? preencherModelo(modelos[0].texto, ctx) : "";
  return '<div class="fu-form" id="formResp"><div class="subtitulo" style="margin-top:0;">Responder ' + esc(String(ctx.nome || "").trim() || ("+" + ctx.remetente)) + ' no WhatsApp</div>'
    + '<div class="modelos">' + modelos.map((m, k) => m.meu
        ? '<span class="aba meu"><button type="button" class="tirar-fundo" data-modelo="' + k + '" style="background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;">★ ' + esc(m.titulo) + '</button>'
          + '<button type="button" class="tirar" data-tirar="' + m.i + '" title="Apagar este modelo" aria-label="Apagar o modelo ' + esc(m.titulo) + '">×</button></span>'
        : '<button type="button" class="aba" data-modelo="' + k + '">' + esc(m.titulo) + '</button>').join("") + '</div>'
    + '<textarea id="respTexto" class="resp-texto" maxlength="1000">' + esc(tela.respTexto) + '</textarea>'
    + '<small style="display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.5;">Complete o que está entre [colchetes]. O WhatsApp abre com o texto pronto: é só conferir e enviar.</small>'
    + '<div class="acoes" style="margin-top:12px;"><a class="btn btn-primary" id="respAbrir" target="_blank" rel="noopener" href="' + esc(linkWhatsApp(ctx.remetente, tela.respTexto)) + '">Abrir no WhatsApp</a>'
    + '<button class="btn" type="button" id="respNovoModelo">Salvar como meu modelo</button>'
    + '<button class="btn" type="button" id="respCancelar">Fechar</button><span class="msg" id="respMsg"></span></div>'
    + (tela.respSalvando ? '<div class="salvar-modelo"><input id="respTitulo" maxlength="40" placeholder="Nome do modelo, ex.: Chave Pix">'
      + '<button class="btn btn-primary" type="button" id="respSalvarModelo">Salvar modelo</button></div>' : '')
    + '</div>';
}
function ligarResposta(box, redesenhar){
  box.querySelectorAll("[data-resp]").forEach(b => b.addEventListener("click", () => {
    const k = b.getAttribute("data-resp");
    tela.resp = tela.resp === k ? null : k; tela.respTexto = null; tela.respSalvando = false; redesenhar();
  }));
  if (!$("formResp")) return;
  const ctx = ctxResposta(tela.resp);
  const atualizar = () => { tela.respTexto = $("respTexto").value; $("respAbrir").href = linkWhatsApp(ctx.remetente, tela.respTexto); };
  $("respTexto").addEventListener("input", atualizar);
  box.querySelectorAll("#formResp [data-modelo]").forEach(b => b.addEventListener("click", () => {
    const m = todosModelos()[Number(b.getAttribute("data-modelo"))];
    if (m){ $("respTexto").value = preencherModelo(m.texto, ctx); atualizar(); $("respTexto").focus(); }
  }));
  box.querySelectorAll("#formResp [data-tirar]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.getAttribute("data-tirar"));
    if (confirm('Apagar o modelo "' + ((respostasProntas[i] || {}).titulo || "") + '"?')) salvarModelos(respostasProntas.filter((_, j) => j !== i), redesenhar);
  }));
  $("respCancelar").addEventListener("click", () => { tela.resp = null; tela.respTexto = null; tela.respSalvando = false; redesenhar(); });
  $("respNovoModelo").addEventListener("click", () => { tela.respSalvando = !tela.respSalvando; redesenhar(); if ($("respTitulo")) $("respTitulo").focus(); });
  if ($("respSalvarModelo")) $("respSalvarModelo").addEventListener("click", () => {
    const titulo = $("respTitulo").value.trim(), texto = $("respTexto").value.trim();
    const msg = $("respMsg"); msg.className = "msg erro";
    if (!titulo){ msg.textContent = "Dê um nome ao modelo."; return; }
    if (!texto){ msg.textContent = "Escreva o texto do modelo."; return; }
    if ((respostasProntas || []).length >= 20){ msg.textContent = "Você já tem 20 modelos. Apague um para salvar outro."; return; }
    // Guarda o nome do cliente como {nome}, para o modelo servir para qualquer cliente.
    const n = String(ctx.nome || "").trim().split(/\s+/)[0];
    let base = texto;
    if (n) base = base.split(", " + n).join("{nome}");
    if (dadosPainel.nome) base = base.split(dadosPainel.nome).join("{negocio}");
    salvarModelos((respostasProntas || []).concat([{ titulo, texto: base }]), redesenhar);
  });
}
async function salvarModelos(lista, redesenhar){
  const msg = $("respMsg");
  if (msg){ msg.className = "msg"; msg.textContent = "Salvando..."; }
  const { data, error } = await supa.rpc("salvar_respostas_prontas", { p_lista: lista });
  if (error || !data || !data.ok){ if (msg){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo."; } return; }
  respostasProntas = data.respostas || lista;
  tela.respSalvando = false;
  redesenhar();
  if ($("respMsg")){ $("respMsg").className = "msg ok"; $("respMsg").textContent = "Modelo salvo ✓"; }
}

/* ---------- Confirmação e lembrete: a dona confirma o horário de um pedido e o cliente recebe a confirmação ---------- */
function agendamentoDoPedido(id){
  return (dadosPainel.agendamentos || []).find(a => a.pedido_id === id && a.status === "confirmado") || null;
}
function quandoBR(iso){
  const tz = dadosPainel.timezone || "America/Sao_Paulo";
  const dt = new Date(iso);
  return dt.toLocaleDateString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit" })
    + " às " + dt.toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}
// Mesmo texto do modelo confirmacao_horario aprovado na Meta (decisoes/confirmacao-lembrete.md no ai-employees).
function textoConfirmacao(servico, data, hora){
  const s = String(servico || "").trim();
  const quando = data && hora
    ? new Date(data + "T12:00:00Z").toLocaleDateString("pt-BR", { timeZone: "UTC", weekday: "long", day: "2-digit", month: "2-digit" }) + " às " + hora
    : "___";
  return "Olá! Aqui é da equipe " + (dadosPainel.nome || "sua empresa") + ". Seu horário de " + (s ? s.charAt(0).toLowerCase() + s.slice(1) : "___")
    + " está confirmado para " + quando + ". Se precisar remarcar, é só responder esta mensagem.";
}
function formHorario(pedidoId){
  const d = dadosPainel;
  const tz = d.timezone || "America/Sao_Paulo";
  const p = (d.pedidos || []).find(x => x.id === pedidoId) || {};
  const dd = p.dados || {};
  const ag = agendamentoDoPedido(pedidoId);
  const data = ag ? new Date(ag.data_hora).toLocaleDateString("en-CA", { timeZone: tz }) : "";
  const hora = ag ? new Date(ag.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  const servico = (ag && ag.servico) || dd.servico || (d.itens && d.itens[p.item]) || "";
  const endereco = (ag && ag.endereco) || dd.endereco || "";
  const dias = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  return '<div class="fu-form" id="formHorario"><div class="subtitulo" style="margin-top:0;">' + (ag ? 'Remarcar horário' : 'Confirmar horário') + '</div>'
    + '<div class="dois-campos" style="margin-bottom:14px;"><div class="campo"><label for="hrData">Dia</label><input id="hrData" type="date" min="' + hojeNegocio(0) + '" value="' + esc(data) + '"></div>'
    + '<div class="campo"><label for="hrHora">Horário</label><input id="hrHora" type="time" value="' + esc(hora) + '"></div></div>'
    + '<div class="campo"><label for="hrServico">Serviço</label><input id="hrServico" maxlength="80" placeholder="Ex.: Corte e escova" value="' + esc(servico) + '"></div>'
    + '<div class="campo"><label for="hrEndereco">Endereço (se o atendimento for no local do cliente)</label><input id="hrEndereco" maxlength="160" value="' + esc(endereco) + '"></div>'
    + '<div class="fu-previa"><span>' + (AVISOS_ATIVO ? 'O cliente recebe no WhatsApp:' : 'Mensagem de confirmação (o envio automático começa em breve; por enquanto, avise o cliente pelo WhatsApp):') + '</span>'
    + '<p id="hrPrevia">' + esc(textoConfirmacao(servico, data, hora)) + '</p></div>'
    + '<small style="display:block;color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5;">'
    + (dias === 0 ? 'Na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.'
      : 'Se o horário for daqui a ' + dias + (dias === 1 ? ' dia' : ' dias') + ' ou mais, na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.') + '</small>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="hrSalvar">' + (ag ? 'Salvar novo horário' : 'Confirmar horário') + '</button>'
    + '<button class="btn" type="button" id="hrCancelar">Cancelar</button><span class="msg" id="hrMsg"></span></div></div>';
}
function ligarHorario(box, redesenhar){
  box.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-conf")); tela.confHorario = tela.confHorario === id ? null : id; redesenhar();
  }));
  if (!$("formHorario")) return;
  const previa = () => { $("hrPrevia").textContent = textoConfirmacao($("hrServico").value, $("hrData").value, $("hrHora").value); };
  ["hrData", "hrHora", "hrServico"].forEach(id => $(id).addEventListener("input", previa));
  $("hrCancelar").addEventListener("click", () => { tela.confHorario = null; redesenhar(); });
  $("hrSalvar").addEventListener("click", () => salvarHorario(tela.confHorario));
}
async function salvarHorario(pedidoId){
  const msg = $("hrMsg"); const btn = $("hrSalvar");
  const data = $("hrData").value, hora = $("hrHora").value, servico = $("hrServico").value.trim();
  msg.className = "msg"; msg.textContent = "";
  if (!data || !hora){ msg.className = "msg erro"; msg.textContent = "Escolha o dia e o horário."; return; }
  if (servico.length < 2){ msg.className = "msg erro"; msg.textContent = "Escreva o serviço."; return; }
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  // Dia e hora no fuso do negócio; o banco converte ("2026-11-06 14:00 America/Sao_Paulo").
  const { data: r, error } = await supa.rpc("confirmar_horario", {
    p_pedido_id: pedidoId, p_data_hora: data + " " + hora + " " + (dadosPainel.timezone || "America/Sao_Paulo"),
    p_servico: servico, p_endereco: $("hrEndereco").value.trim() || null,
  });
  if (error || !r || !r.ok){
    btn.disabled = false; btn.textContent = textoBtn;
    msg.className = "msg erro";
    msg.textContent = /data inv/.test((error && error.message) || "") ? "Escolha um dia e horário a partir de agora." : "Não foi possível salvar agora. Tente de novo em alguns instantes.";
    return;
  }
  tela.confHorario = null;
  carregarPainel();
}
function chipAviso(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<span class="chip ok">Cliente confirmou ✅</span>';
  if (a.confirmacao_cliente === "remarcar") return '<span class="chip alerta">Pediu para remarcar</span>';
  const l = a.lembrete;
  if (l && l.status === "pendente"){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    return '<span class="chip">Lembrete ' + new Date(l.enviar_em).toLocaleDateString("pt-BR", { timeZone: tz, day: "2-digit", month: "2-digit" }) + '</span>';
  }
  if (l && l.status === "enviado") return '<span class="chip">Lembrete enviado</span>';
  return "";
}
function linhaLembrete(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<br><b>Lembrete:</b> o cliente confirmou o horário.';
  if (a.confirmacao_cliente === "remarcar") return '<br><b>Lembrete:</b> o cliente pediu para remarcar. Fale com ele no WhatsApp.';
  const l = a.lembrete;
  if (!l) return "";
  if (l.status === "pendente") return '<br><b>Lembrete:</b> sai ' + esc(quandoBR(l.enviar_em)) + ', pedindo para o cliente confirmar.';
  if (l.status === "enviado") return '<br><b>Lembrete:</b> enviado. O cliente ainda não respondeu.';
  if (l.status === "falhou") return '<br><b>Lembrete:</b> não foi possível enviar. Avise o cliente pelo WhatsApp.';
  return "";
}
function blocoLembrete(d){
  const atual = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  const ops = [[0, "Todos os horários"], [2, "Marcados com 2 dias ou mais de antecedência"], [3, "Marcados com 3 dias ou mais de antecedência"],
    [7, "Marcados com 1 semana ou mais de antecedência"], [14, "Marcados com 2 semanas ou mais de antecedência"]];
  if (!ops.some(o => o[0] === atual)) ops.push([atual, "Marcados com " + atual + " dias ou mais de antecedência"]);
  return '<div class="lembrete-cfg"><label for="lembreteDias" class="subtitulo" style="display:block;">Lembrete na véspera' + (AVISOS_ATIVO ? '' : ' (em breve)') + ': para quais horários?</label>'
    + '<select id="lembreteDias">' + ops.map(([v, n]) => '<option value="' + v + '"' + (v === atual ? ' selected' : '') + '>' + esc(n) + '</option>').join("") + '</select>'
    + '<small>Um dia antes, às 10h, o cliente recebe um lembrete e responde "Confirmo" ou "Preciso remarcar". A resposta aparece aqui no agendamento.</small>'
    + '<span class="msg" id="lembreteMsg"></span></div>';
}
async function salvarLembrete(valor){
  const msg = $("lembreteMsg"); const sel = $("lembreteDias");
  sel.disabled = true; msg.className = "msg"; msg.textContent = "Salvando...";
  const { data, error } = await supa.rpc("salvar_lembrete", { p_dias: Number(valor) });
  sel.disabled = false;
  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar. Tente de novo."; return; }
  dadosPainel.lembrete_antecedencia_dias = Number(valor);
  msg.textContent = "Salvo ✓";
}

// Conectar a agenda do Google: o dono compartilha a agenda com a conta da Auryx e informa aqui qual é a agenda dele.
function blocoAgenda(d){
  if (d.agenda_conectada && !tela.editarAgenda){
    return '<div class="agenda-ok">' + icone("agenda") + '<span>Agenda conectada: <b>' + esc(d.agenda_conectada) + '</b>. A secretária consulta os horários livres e marca os agendamentos nela.</span>'
      + '<button class="btn" type="button" id="trocarAgenda">Trocar</button></div>';
  }
  const conta = AGENDA_AURYX ? '<b>' + esc(AGENDA_AURYX) + '</b>' : 'o e-mail da Auryx que enviamos para você';
  return '<div class="aviso info" style="margin-top:16px;display:block;">'
    + '<div class="txt"><b>' + (d.agenda_conectada ? 'Trocar a agenda' : 'Conecte a sua agenda do Google') + '</b>'
    + 'Assim a secretária vê os seus horários livres e marca os clientes direto na sua agenda. Leva 2 minutos:</div>'
    + '<ol class="passos">'
    + '<li>No computador, abra o <a href="https://calendar.google.com/calendar/u/0/r/settings" target="_blank" rel="noopener">Google Agenda → Configurações</a>.</li>'
    + '<li>No menu da esquerda, role até <b>Configurações das minhas agendas</b>, clique na sua agenda (ela aparece com o seu nome) e depois em <b>Compartilhado com</b>.</li>'
    + '<li>Clique em <b>Adicionar pessoas e grupos</b>, coloque ' + conta + ', escolha <b>Fazer alterações nos eventos</b> e clique em <b>Enviar</b>. Depois, clique em <b>Conectar agenda</b> aqui embaixo.</li>'
    + '</ol>'
    + '<div class="campo" style="margin:14px 0 0;"><label for="agendaId">E-mail da sua agenda do Google</label>'
    + '<input id="agendaId" placeholder="seuemail@gmail.com" value="' + esc(d.agenda_conectada || emailLogado || "") + '">'
    + '<small style="color:#BFDBFE;">Já preenchemos com o e-mail do seu login. Só troque se a sua agenda for de outro e-mail.</small></div>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="salvarAgenda">Conectar agenda</button>'

function ligarAgenda(){
  if ($("trocarAgenda")) $("trocarAgenda").addEventListener("click", () => { tela.editarAgenda = true; renderAgenda(); });
  if ($("cancelarAgenda")) $("cancelarAgenda").addEventListener("click", () => { tela.editarAgenda = false; renderAgenda(); });
  if ($("salvarAgenda")) $("salvarAgenda").addEventListener("click", () => salvarAgenda($("agendaId").value));
  if ($("desconectarAgenda")) $("desconectarAgenda").addEventListener("click", () => {
    if (confirm("Desconectar a agenda? A secretária deixa de marcar horários até você conectar de novo.")) salvarAgenda("");
  });
}

async function salvarAgenda(valor){
  const msg = $("agendaMsg"); const btn = $("salvarAgenda");
  const agenda = String(valor || "").trim().toLowerCase();
  msg.className = "msg"; msg.textContent = "";
  if (agenda && !/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(agenda)){
    msg.className = "msg erro"; msg.textContent = "Confira o e-mail da agenda, como seuemail@gmail.com."; return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("conectar_agenda", { p_agenda: agenda });
  btn.disabled = false; btn.textContent = "Conectar agenda";
  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  dadosPainel.agenda_conectada = agenda || null;
  dadosPainel.usa_agenda = !!agenda || (dadosPainel.agendamentos || []).length > 0;
  tela.editarAgenda = false;
  renderAgenda();
}

async function mudarAgendamento(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-statusag");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_agendamento", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("agMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela; "hoje" no menu e no início conta só os confirmados de hoje.
  const ag = dadosPainel.agendamentos.find(a => a.id === id);
  if (ag){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    const diaDe = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
    const ehHoje = diaDe(ag.data_hora) === diaDe(new Date().toISOString());
    if (ehHoje && ag.status === "confirmado" && status !== "confirmado") dadosPainel.agendamentos_hoje = Math.max(0, Number(dadosPainel.agendamentos_hoje || 0) - 1);
    if (ehHoje && ag.status !== "confirmado" && status === "confirmado") dadosPainel.agendamentos_hoje = Number(dadosPainel.agendamentos_hoje || 0) + 1;
    ag.status = status;
  }
  tela.agendamento = null;
  render(dadosPainel);
}

async function mudarStatus(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-status");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_pedido", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("pedMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela sem recarregar tudo; o pedido sai da aba atual e fica fechado.
  const antes = dadosPainel.pedidos.find(p => p.id === id);
  if (antes){
    if (antes.status === "pendente" && status !== "pendente") dadosPainel.pedidos_pendentes = Math.max(0, Number(dadosPainel.pedidos_pendentes || 0) - 1);
    if (antes.status !== "pendente" && status === "pendente") dadosPainel.pedidos_pendentes = Number(dadosPainel.pedidos_pendentes || 0) + 1;
    antes.status = status; antes.status_em = new Date().toISOString();
  }
  tela.pedido = null;
  render(dadosPainel);
}

// O Stripe guarda de qual negócio e e-mail veio a assinatura (para ativar o plano certo).
function linkPagamento(link, businessId){
  try{
    const u = new URL(link);
    if (businessId) u.searchParams.set("client_reference_id", "negocio_" + businessId);
    if (emailLogado) u.searchParams.set("prefilled_email", emailLogado);
    return u.toString();
  }catch(e){ return link; }
}

async function devolverConversa(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Devolvendo...';
  const { error } = await supa.rpc("devolver_conversa", { p_remetente: btn.getAttribute("data-devolver") });
  if (error){ btn.disabled = false; btn.textContent = "Tentar de novo"; return; }
  carregarPainel();
}

/* ---------- Personalizar a secretária (só para planos pagos) ---------- */
function renderPersonalizar(d){
  const box = $("personalizar");
  if (!d.pode_personalizar){
    box.innerHTML = '<h2>Personalizar sua secretária 🔒</h2>'
      + '<p class="bloqueado">Disponível depois de assinar um plano: você edita as perguntas e respostas da secretária e escolhe quais serviços ela oferece aos seus clientes.</p>';
    return;
  }
  faqEdicao = (Array.isArray(d.faq) ? d.faq : []).map(f => ({ pergunta: f.pergunta || "", resposta: f.resposta || "" }));
  const servicos = d.servicos || [];
  const ativos = servicos.filter(s => s.ativo).length;
  const resumo = faqEdicao.length + (faqEdicao.length === 1 ? ' pergunta cadastrada' : ' perguntas cadastradas')
    + (servicos.length ? ' · ' + ativos + ' de ' + servicos.length + ' serviços ativos' : '');
  // Abre e fecha só escondendo: o que foi digitado e ainda não salvo continua lá.
  box.innerHTML = '<h2>Personalizar sua secretária</h2><p class="sub">' + esc(resumo) + '</p>'
    + '<div>'
    + '<p class="sub">A secretária responde exatamente com o que estiver aqui. Se faltar uma informação, ela diz que a equipe vai confirmar, e nunca inventa.</p>'
    + '<div class="subtitulo">Perguntas e respostas <span id="faqConta" style="color:var(--muted);font-weight:400;"></span></div><div id="faqLista"></div>'
    + '<button class="btn" type="button" id="faqAdd">+ Adicionar pergunta</button>'
    + (servicos.length ? '<div class="subtitulo">Serviços que você oferece</div>'
      + '<p class="sub" style="margin-bottom:8px;">Desmarque o que você não faz: a secretária deixa de oferecer e tira do menu.</p>'
      + '<div class="servicos">' + servicos.map(s => '<label class="servico"><input type="checkbox" data-servico="' + esc(s.id) + '"' + (s.ativo ? ' checked' : '') + '> ' + esc(s.titulo) + '</label>').join('') + '</div>' : '')
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="salvarPers">Salvar alterações</button><span class="msg" id="persMsg"></span></div></div>';
  renderFaqLista();
  $("faqAdd").addEventListener("click", () => { faqEdicao.push({ pergunta: "", resposta: "" }); renderFaqLista(); });
  $("salvarPers").addEventListener("click", salvarPersonalizacao);
}

function renderFaqLista(){
  const lista = $("faqLista");
  lista.innerHTML = "";
  faqEdicao.forEach((f, i) => {
    const row = document.createElement("div"); row.className = "faq-row";
    const q = document.createElement("input"); q.value = f.pergunta; q.placeholder = "Pergunta (ex.: Vocês atendem aos domingos?)";
    q.addEventListener("input", () => { f.pergunta = q.value; });
    const a = document.createElement("textarea"); a.value = f.resposta; a.placeholder = "Sua resposta";
    a.addEventListener("input", () => { f.resposta = a.value; });
    const del = document.createElement("button"); del.type = "button"; del.className = "faq-del"; del.textContent = "×"; del.title = "Remover";
    del.addEventListener("click", () => { faqEdicao.splice(i, 1); renderFaqLista(); });
    row.appendChild(del); row.appendChild(q); row.appendChild(a); lista.appendChild(row);
  });
  // Limite do plano: Básico 10, Premium e Completo 30.
  const limite = Number((dadosPainel && dadosPainel.faq_limite) || 30);
  $("faqAdd").style.display = faqEdicao.length >= limite ? "none" : "inline-block";
  $("faqConta").textContent = "(" + faqEdicao.length + " de " + limite + ")"
    + (faqEdicao.length > limite ? " · o seu plano guarda só as " + limite + " primeiras" : "")
    + (faqEdicao.length >= limite && limite < 30 ? " · no Premium, até 30" : "");
}

async function salvarPersonalizacao(){
  const msg = $("persMsg"); const btn = $("salvarPers");
  msg.className = "msg"; msg.textContent = "";
  const desativados = Array.from(document.querySelectorAll("[data-servico]")).filter(c => !c.checked).map(c => c.getAttribute("data-servico"));
  const faq = faqEdicao.map(f => ({ pergunta: f.pergunta.trim(), resposta: f.resposta.trim() })).filter(f => f.pergunta && f.resposta);
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { error } = await supa.rpc("salvar_personalizacao", { p_faq: faq, p_desativados: desativados });
  btn.disabled = false; btn.textContent = "Salvar alterações";
  if (error){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  msg.className = "msg ok"; msg.textContent = "Salvo! A secretária já usa as informações novas.";
}

/* ---------- Seus dados: nome do negócio (usado pela secretária), nome do dono e WhatsApp de avisos ---------- */
function renderDados(d){
  const box = $("seusDados");
  const resumo = (d.nome || "") + (d.contato_nome ? " · " + d.contato_nome : "");
  const agencia = /viage/i.test(String(d.tipo_negocio || ""));
  const rotuloNome = agencia ? "Nome da sua agência" : "Nome do seu negócio";

    + '<div class="campo"><label for="dNome">' + rotuloNome + '</label><input id="dNome" maxlength="80" value="' + esc(d.nome || "") + '">'

    + '<div class="campo"><label for="dContato">Seu nome</label><input id="dContato" maxlength="80" value="' + esc(d.contato_nome || "") + '">'
    + '<small>Para o painel te cumprimentar pelo nome.</small></div>'
    + '<div class="campo"><label for="dWhats">WhatsApp para receber os avisos</label><input id="dWhats" inputmode="tel" maxlength="20" value="' + esc(d.whatsapp_avisos || "") + '">'
    + '<small>Com código do país e DDD, só números. Ex.: 5511999998888. É para onde vão os avisos de pedidos e de clientes esperando.</small></div>'
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="salvarDados">Salvar</button><span class="msg" id="dadosMsg"></span></div>'

}

async function salvarDados(){
  const msg = $("dadosMsg"); const btn = $("salvarDados");
  const nome = $("dNome").value.trim();
  const contato = $("dContato").value.trim();
  const whats = $("dWhats").value.replace(/\D/g, "");
  msg.className = "msg"; msg.textContent = "";
  if (nome.length < 2){ msg.className = "msg erro"; msg.textContent = "Escreva o nome da sua agência."; return; }
  if (whats && (whats.length < 10 || whats.length > 15)){ msg.className = "msg erro"; msg.textContent = "Confira o WhatsApp: código do país + DDD + número, só números."; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { error } = await supa.rpc("salvar_dados", { p_nome: nome, p_contato_nome: contato, p_whatsapp: whats });
  btn.disabled = false; btn.textContent = "Salvar";
  if (error){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  await carregarPainel();
}

$("loginForm").addEventListener("submit", async (e) => {
