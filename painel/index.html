function corpoRespostas(){
  const visiveis = bibliotecaConta(false);
  const busca = (tela.rrBusca || "").trim();
  const cats = categoriasConta(visiveis);
  const favs = visiveis.filter(m => m.fav);
  let html = '';
  let lista;
  if (busca) lista = buscarRespostas(visiveis, busca);
  else {
    const abas = (favs.length ? ["Favoritas"] : []).concat(cats);
    if (!abas.includes(tela.rrCat)) tela.rrCat = abas[0];
    html += '<div class="abas">' + abas.map(c => '<button type="button" class="aba' + (c === tela.rrCat ? ' ativa' : '') + '" data-rrcat="' + esc(c) + '">'
      + (c === "Favoritas" ? '★ ' : '') + esc(c) + ' (' + (c === "Favoritas" ? favs.length : visiveis.filter(m => m.cat === c).length) + ')</button>').join("") + '</div>';
    lista = tela.rrCat === "Favoritas" ? favs : visiveis.filter(m => m.cat === tela.rrCat);
  }
  if (!lista.length) return html + '<p class="sub" style="margin:0;">Nenhuma resposta encontrada.</p>';
  return html + lista.map(m => '<div class="rr-linha"><div class="rr-texto"><b>' + esc(m.titulo) + '</b>'
      + (busca ? '<span class="quem"> · ' + esc(m.cat) + '</span>' : '') + (m.editado ? '<span class="quem"> · editada</span>' : '') + (m.meu ? '<span class="quem"> · sua</span>' : '')
      + '<p>' + esc(m.texto) + '</p></div>'
      + '<div class="ped-acoes" style="margin:0;">'
      + '<button class="btn" type="button" data-rrfav="' + esc(m.id) + '">' + (m.fav ? '★ Favorita' : '☆ Favoritar') + '</button>'
      + (podeEditarRespostas() ? '<button class="btn" type="button" data-rreditar="' + esc(m.id) + '">Editar</button>'
        + (m.meu ? '<button class="btn" type="button" data-rrapagar="' + esc(m.id) + '">Apagar</button>'
                 : '<button class="btn" type="button" data-rresconder="' + esc(m.id) + '">Esconder</button>')
        + (m.editado ? '<button class="btn" type="button" data-rrrestaurar="' + esc(m.id) + '">Voltar ao original</button>' : '') : '')
      + '</div></div>').join("");
}
function formEditarResposta(){
  const e = tela.rrEditar;
  const cats = categoriasConta(bibliotecaConta(true)).concat(["Minhas respostas"]).filter((c, i, a) => a.indexOf(c) === i);
  if (e.cat && !cats.includes(e.cat)) cats.push(e.cat);
  return '<div class="fu-form" id="rrForm"><div class="subtitulo" style="margin-top:0;">' + (e.id ? 'Editar resposta' : 'Nova resposta') + '</div>'
    + '<div class="dois-campos" style="margin-bottom:14px;"><div class="campo"><label for="rrTitulo">Nome</label><input id="rrTitulo" maxlength="60" value="' + esc(e.titulo || "") + '" placeholder="Ex.: Chave Pix"></div>'
    + '<div class="campo"><label for="rrCatSel">Categoria</label><select id="rrCatSel" class="rr-select">' + cats.map(c => '<option' + (c === (e.cat || "Minhas respostas") ? ' selected' : '') + '>' + esc(c) + '</option>').join("") + '</select></div></div>'
    + '<div class="campo"><label for="rrTextoEd">Texto</label><textarea id="rrTextoEd" class="resp-texto" maxlength="1500">' + esc(e.texto || "") + '</textarea>'
    + '<small>Use {nome}, {negocio}, {servico}, {quando}, {destino}, {datas} e {assunto} para o painel preencher com os dados do cliente. Use [colchetes] para o que a equipe completa na hora: o painel não deixa enviar sem completar.</small></div>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="rrSalvar">Salvar</button>'
    + '<button class="btn" type="button" id="rrCancelar">Cancelar</button><span class="msg" id="rrFormMsg"></span></div></div>';
}
function ligarRespostas(){
  const R = () => respostasRapidas;
  const salvar = async (novo, msgId) => {
    const m = $(msgId || "rrMsg"); if (m){ m.className = "msg"; m.textContent = "Salvando..."; }
    const ok = await salvarRespostasRapidas(novo);
    if (!ok){ if (m){ m.className = "msg erro"; m.textContent = "Não foi possível salvar agora. Tente de novo."; } return false; }
    return true;
  };
  const ligarCorpo = () => {
    const c = $("rrCorpo");
    c.querySelectorAll("[data-rrcat]").forEach(b => b.addEventListener("click", () => { tela.rrCat = b.getAttribute("data-rrcat"); c.innerHTML = corpoRespostas(); ligarCorpo(); }));
    c.querySelectorAll("[data-rrfav]").forEach(b => b.addEventListener("click", async () => { b.disabled = true; if (await alternarFavorita(b.getAttribute("data-rrfav"))) renderRespostas(); else b.disabled = false; }));
    c.querySelectorAll("[data-rreditar]").forEach(b => b.addEventListener("click", () => {
      const m = bibliotecaConta(true).find(x => x.id === b.getAttribute("data-rreditar"));
      if (m){ tela.rrEditar = { id: m.id, cat: m.cat, titulo: m.titulo, texto: m.texto }; renderRespostas(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }));
    c.querySelectorAll("[data-rresconder]").forEach(b => b.addEventListener("click", async () => {
      const id = b.getAttribute("data-rresconder");
      if (await salvar(Object.assign({}, R(), { ocultos: (R().ocultos || []).concat([id]), favoritos: (R().favoritos || []).filter(x => x !== id) }))) renderRespostas();
    }));
    c.querySelectorAll("[data-rrapagar]").forEach(b => b.addEventListener("click", async () => {
      const id = b.getAttribute("data-rrapagar");
      const m = (R().meus || []).find(x => x.id === id);
      if (!confirm('Apagar a resposta "' + ((m || {}).titulo || "") + '"?')) return;
      if (await salvar(Object.assign({}, R(), { meus: (R().meus || []).filter(x => x.id !== id), favoritos: (R().favoritos || []).filter(x => x !== id) }))) renderRespostas();
    }));
    c.querySelectorAll("[data-rrrestaurar]").forEach(b => b.addEventListener("click", async () => {
      const id = b.getAttribute("data-rrrestaurar");
      if (await salvar(Object.assign({}, R(), { meus: (R().meus || []).filter(x => x.id !== id) }))) renderRespostas();
    }));
  };
  ligarCorpo();
  $("rrBusca").addEventListener("input", (e) => { tela.rrBusca = e.target.value; $("rrCorpo").innerHTML = corpoRespostas(); ligarCorpo(); });
  document.querySelectorAll("#respostasPainel [data-ir]").forEach(b => b.addEventListener("click", () => irPara(b.getAttribute("data-ir"))));
  if ($("rrNova")) $("rrNova").addEventListener("click", () => { tela.rrEditar = { id: null, cat: tela.rrCat && tela.rrCat !== "Favoritas" ? tela.rrCat : "Minhas respostas", titulo: "", texto: "Olá, {nome}! " }; renderRespostas(); if ($("rrTitulo")) $("rrTitulo").focus(); });
  if ($("rrEscondidas")) $("rrEscondidas").addEventListener("toggle", (e) => { tela.rrVerEscondidas = e.target.open; });
  document.querySelectorAll("[data-rrmostrar]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-rrmostrar");
    if (await salvar(Object.assign({}, R(), { ocultos: (R().ocultos || []).filter(x => x !== id) }))) renderRespostas();
  }));
  if ($("rrForm") && podeEditarRespostas()){
    $("rrCancelar").addEventListener("click", () => { tela.rrEditar = null; renderRespostas(); });
    $("rrSalvar").addEventListener("click", async () => {
      const titulo = $("rrTitulo").value.trim(), texto = $("rrTextoEd").value.trim(), cat = $("rrCatSel").value;
      const msg = $("rrFormMsg"); msg.className = "msg erro";
      if (!titulo){ msg.textContent = "Dê um nome à resposta."; return; }
      if (!texto){ msg.textContent = "Escreva o texto."; return; }
      if (!tela.rrEditar.id && (R().meus || []).length >= 80){ msg.textContent = "Limite de respostas atingido. Apague uma para criar outra."; return; }
      const id = tela.rrEditar.id || ("m" + Date.now().toString(36));
      const meus = (R().meus || []).filter(x => x.id !== id).concat([{ id, cat, titulo, texto }]);
      if (await salvar(Object.assign({}, R(), { meus }), "rrFormMsg")){ tela.rrEditar = null; tela.rrCat = cat; tela.rrBusca = ""; renderRespostas(); $("rrMsg").className = "msg ok"; $("rrMsg").textContent = "Resposta salva ✓"; }
    });
  }
}

/* ---------- Confirmação e lembrete: a dona confirma o horário de um pedido e o cliente recebe a confirmação ---------- */
function agendamentoDoPedido(id){
  return (dadosPainel.agendamentos || []).find(a => a.pedido_id === id && a.status === "confirmado") || null;
}
function quandoBR(iso){
  const tz = dadosPainel.timezone || "America/Sao_Paulo";
  const dt = new Date(iso);
  return dt.toLocaleDateString("pt-BR", { timeZone: tz, weekday: "long", day: "2-digit", month: "2-digit" })
    + " às " + dt.toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
}
// Mesmo texto do modelo confirmacao_horario aprovado na Meta (decisoes/confirmacao-lembrete.md no ai-employees).
function textoConfirmacao(servico, data, hora){
  const s = String(servico || "").trim();
  const quando = data && hora
    ? new Date(data + "T12:00:00Z").toLocaleDateString("pt-BR", { timeZone: "UTC", weekday: "long", day: "2-digit", month: "2-digit" }) + " às " + hora
    : "___";
  return "Olá! Aqui é da equipe " + (dadosPainel.nome || "sua empresa") + ". Seu horário de " + (s ? s.charAt(0).toLowerCase() + s.slice(1) : "___")
    + " está confirmado para " + quando + ". Se precisar remarcar, é só responder esta mensagem.";
}
function formHorario(pedidoId){
  const d = dadosPainel;
  const tz = d.timezone || "America/Sao_Paulo";
  const p = (d.pedidos || []).find(x => x.id === pedidoId) || {};
  const dd = p.dados || {};
  const ag = agendamentoDoPedido(pedidoId);
  const data = ag ? new Date(ag.data_hora).toLocaleDateString("en-CA", { timeZone: tz }) : "";
  const hora = ag ? new Date(ag.data_hora).toLocaleTimeString("pt-BR", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  const servico = (ag && ag.servico) || dd.servico || (d.itens && d.itens[p.item]) || "";
  const endereco = (ag && ag.endereco) || dd.endereco || "";
  const dias = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  return '<div class="fu-form" id="formHorario"><div class="subtitulo" style="margin-top:0;">' + (ag ? 'Remarcar horário' : 'Confirmar horário') + '</div>'
    + '<div class="dois-campos" style="margin-bottom:14px;"><div class="campo"><label for="hrData">Dia</label><input id="hrData" type="date" min="' + hojeNegocio(0) + '" value="' + esc(data) + '"></div>'
    + '<div class="campo"><label for="hrHora">Horário</label><input id="hrHora" type="time" value="' + esc(hora) + '"></div></div>'
    + '<div class="campo"><label for="hrServico">Serviço</label><input id="hrServico" maxlength="80" placeholder="Ex.: Corte e escova" value="' + esc(servico) + '"></div>'
    + '<div class="campo"><label for="hrEndereco">Endereço (se o atendimento for no local do cliente)</label><input id="hrEndereco" maxlength="160" value="' + esc(endereco) + '"></div>'
    + '<div class="fu-previa"><span>' + (AVISOS_ATIVO ? 'O cliente recebe no WhatsApp:' : 'Mensagem de confirmação (o envio automático começa em breve; por enquanto, avise o cliente pelo WhatsApp):') + '</span>'
    + '<p id="hrPrevia">' + esc(textoConfirmacao(servico, data, hora)) + '</p></div>'
    + '<small style="display:block;color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5;">'
    + (dias === 0 ? 'Na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.'
      : 'Se o horário for daqui a ' + dias + (dias === 1 ? ' dia' : ' dias') + ' ou mais, na véspera, às 10h, o cliente recebe um lembrete para confirmar ou remarcar.') + '</small>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="hrSalvar">' + (ag ? 'Salvar novo horário' : 'Confirmar horário') + '</button>'
    + '<button class="btn" type="button" id="hrCancelar">Cancelar</button><span class="msg" id="hrMsg"></span></div></div>';
}
function ligarHorario(box, redesenhar){
  box.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.getAttribute("data-conf")); tela.confHorario = tela.confHorario === id ? null : id; redesenhar();
  }));
  if (!$("formHorario")) return;
  const previa = () => { $("hrPrevia").textContent = textoConfirmacao($("hrServico").value, $("hrData").value, $("hrHora").value); };
  ["hrData", "hrHora", "hrServico"].forEach(id => $(id).addEventListener("input", previa));
  $("hrCancelar").addEventListener("click", () => { tela.confHorario = null; redesenhar(); });
  $("hrSalvar").addEventListener("click", () => salvarHorario(tela.confHorario));
}
async function salvarHorario(pedidoId){
  const msg = $("hrMsg"); const btn = $("hrSalvar");
  const data = $("hrData").value, hora = $("hrHora").value, servico = $("hrServico").value.trim();
  msg.className = "msg"; msg.textContent = "";
  if (!data || !hora){ msg.className = "msg erro"; msg.textContent = "Escolha o dia e o horário."; return; }
  if (servico.length < 2){ msg.className = "msg erro"; msg.textContent = "Escreva o serviço."; return; }
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  // Dia e hora no fuso do negócio; o banco converte ("2026-11-06 14:00 America/Sao_Paulo").
  const { data: r, error } = await supa.rpc("confirmar_horario", {
    p_pedido_id: pedidoId, p_data_hora: data + " " + hora + " " + (dadosPainel.timezone || "America/Sao_Paulo"),
    p_servico: servico, p_endereco: $("hrEndereco").value.trim() || null,
  });
  if (error || !r || !r.ok){
    btn.disabled = false; btn.textContent = textoBtn;
    msg.className = "msg erro";
    msg.textContent = /data inv/.test((error && error.message) || "") ? "Escolha um dia e horário a partir de agora." : "Não foi possível salvar agora. Tente de novo em alguns instantes.";
    return;
  }
  tela.confHorario = null;
  carregarPainel();
}
function chipAviso(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<span class="chip ok">Cliente confirmou ✅</span>';
  if (a.confirmacao_cliente === "remarcar") return '<span class="chip alerta">Pediu para remarcar</span>';
  const l = a.lembrete;
  if (l && l.status === "pendente"){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    return '<span class="chip">Lembrete ' + new Date(l.enviar_em).toLocaleDateString("pt-BR", { timeZone: tz, day: "2-digit", month: "2-digit" }) + '</span>';
  }
  if (l && l.status === "enviado") return '<span class="chip">Lembrete enviado</span>';
  return "";
}
function linhaLembrete(a){
  if (a.status !== "confirmado") return "";
  if (a.confirmacao_cliente === "confirmou") return '<br><b>Lembrete:</b> o cliente confirmou o horário.';
  if (a.confirmacao_cliente === "remarcar") return '<br><b>Lembrete:</b> o cliente pediu para remarcar. Fale com ele no WhatsApp.';
  const l = a.lembrete;
  if (!l) return "";
  if (l.status === "pendente") return '<br><b>Lembrete:</b> sai ' + esc(quandoBR(l.enviar_em)) + ', pedindo para o cliente confirmar.';
  if (l.status === "enviado") return '<br><b>Lembrete:</b> enviado. O cliente ainda não respondeu.';
  if (l.status === "falhou") return '<br><b>Lembrete:</b> não foi possível enviar. Avise o cliente pelo WhatsApp.';
  return "";
}
function blocoLembrete(d){
  const atual = Number(d.lembrete_antecedencia_dias != null ? d.lembrete_antecedencia_dias : 7);
  const ops = [[0, "Todos os horários"], [2, "Marcados com 2 dias ou mais de antecedência"], [3, "Marcados com 3 dias ou mais de antecedência"],
    [7, "Marcados com 1 semana ou mais de antecedência"], [14, "Marcados com 2 semanas ou mais de antecedência"]];
  if (!ops.some(o => o[0] === atual)) ops.push([atual, "Marcados com " + atual + " dias ou mais de antecedência"]);
  return '<div class="lembrete-cfg"><label for="lembreteDias" class="subtitulo" style="display:block;">Lembrete na véspera' + (AVISOS_ATIVO ? '' : ' (em breve)') + ': para quais horários?</label>'
    + '<select id="lembreteDias">' + ops.map(([v, n]) => '<option value="' + v + '"' + (v === atual ? ' selected' : '') + '>' + esc(n) + '</option>').join("") + '</select>'
    + '<small>Um dia antes, às 10h, o cliente recebe um lembrete e responde "Confirmo" ou "Preciso remarcar". A resposta aparece aqui no agendamento.</small>'
    + '<span class="msg" id="lembreteMsg"></span></div>';
}
async function salvarLembrete(valor){
  const msg = $("lembreteMsg"); const sel = $("lembreteDias");
  sel.disabled = true; msg.className = "msg"; msg.textContent = "Salvando...";
  const { data, error } = await supa.rpc("salvar_lembrete", { p_dias: Number(valor) });
  sel.disabled = false;
  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar. Tente de novo."; return; }
  dadosPainel.lembrete_antecedencia_dias = Number(valor);
  msg.textContent = "Salvo ✓";
}

// Conectar a agenda do Google: o dono compartilha a agenda com a conta da Auryx e informa aqui qual é a agenda dele.
function blocoAgenda(d){
  if (d.agenda_conectada && !tela.editarAgenda){
    return '<div class="agenda-ok">' + icone("agenda") + '<span>Agenda conectada: <b>' + esc(d.agenda_conectada) + '</b>. A secretária consulta os horários livres e marca os agendamentos nela.</span>'
      + '<button class="btn" type="button" id="trocarAgenda">Trocar</button></div>';
  }
  const conta = AGENDA_AURYX ? '<b>' + esc(AGENDA_AURYX) + '</b>' : 'o e-mail da Auryx que enviamos para você';
  return '<div class="aviso info" style="margin-top:16px;display:block;">'
    + '<div class="txt"><b>' + (d.agenda_conectada ? 'Trocar a agenda' : 'Conecte a sua agenda do Google') + '</b>'
    + 'Assim a secretária vê os seus horários livres e marca os clientes direto na sua agenda. Leva 2 minutos:</div>'
    + '<ol class="passos">'
    + '<li>No computador, abra o <a href="https://calendar.google.com/calendar/u/0/r/settings" target="_blank" rel="noopener">Google Agenda → Configurações</a>.</li>'
    + '<li>No menu da esquerda, role até <b>Configurações das minhas agendas</b>, clique na sua agenda (ela aparece com o seu nome) e depois em <b>Compartilhado com</b>.</li>'
    + '<li>Clique em <b>Adicionar pessoas e grupos</b>, coloque ' + conta + ', escolha <b>Fazer alterações nos eventos</b> e clique em <b>Enviar</b>. Depois, clique em <b>Conectar agenda</b> aqui embaixo.</li>'
    + '</ol>'
    + '<div class="campo" style="margin:14px 0 0;"><label for="agendaId">E-mail da sua agenda do Google</label>'
    + '<input id="agendaId" placeholder="seuemail@gmail.com" value="' + esc(d.agenda_conectada || emailLogado || "") + '">'
    + '<small style="color:#BFDBFE;">Já preenchemos com o e-mail do seu login. Só troque se a sua agenda for de outro e-mail.</small></div>'
    + '<div class="acoes" style="margin-top:12px;"><button class="btn btn-primary" type="button" id="salvarAgenda">Conectar agenda</button>'
    + (d.agenda_conectada ? '<button class="btn" type="button" id="desconectarAgenda">Desconectar</button><button class="btn" type="button" id="cancelarAgenda">Cancelar</button>' : '')
    + '<span class="msg" id="agendaMsg"></span></div></div>';
}

function ligarAgenda(){
  if ($("trocarAgenda")) $("trocarAgenda").addEventListener("click", () => { tela.editarAgenda = true; renderAgenda(); });
  if ($("cancelarAgenda")) $("cancelarAgenda").addEventListener("click", () => { tela.editarAgenda = false; renderAgenda(); });
  if ($("salvarAgenda")) $("salvarAgenda").addEventListener("click", () => salvarAgenda($("agendaId").value));
  if ($("desconectarAgenda")) $("desconectarAgenda").addEventListener("click", () => {
    if (confirm("Desconectar a agenda? A secretária deixa de marcar horários até você conectar de novo.")) salvarAgenda("");
  });
}

async function salvarAgenda(valor){
  const msg = $("agendaMsg"); const btn = $("salvarAgenda");
  const agenda = String(valor || "").trim().toLowerCase();
  msg.className = "msg"; msg.textContent = "";
  if (agenda && !/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(agenda)){
    msg.className = "msg erro"; msg.textContent = "Confira o e-mail da agenda, como seuemail@gmail.com."; return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("conectar_agenda", { p_agenda: agenda });
  btn.disabled = false; btn.textContent = "Conectar agenda";
  if (error || !data || !data.ok){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  dadosPainel.agenda_conectada = agenda || null;
  dadosPainel.usa_agenda = !!agenda || (dadosPainel.agendamentos || []).length > 0;
  tela.editarAgenda = false;
  renderAgenda();
}

async function mudarAgendamento(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-statusag");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_agendamento", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("agMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela; "hoje" no menu e no início conta só os confirmados de hoje.
  const ag = dadosPainel.agendamentos.find(a => a.id === id);
  if (ag){
    const tz = dadosPainel.timezone || "America/Sao_Paulo";
    const diaDe = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
    const ehHoje = diaDe(ag.data_hora) === diaDe(new Date().toISOString());
    if (ehHoje && ag.status === "confirmado" && status !== "confirmado") dadosPainel.agendamentos_hoje = Math.max(0, Number(dadosPainel.agendamentos_hoje || 0) - 1);
    if (ehHoje && ag.status !== "confirmado" && status === "confirmado") dadosPainel.agendamentos_hoje = Number(dadosPainel.agendamentos_hoje || 0) + 1;
    ag.status = status;
  }
  tela.agendamento = null;
  render(dadosPainel);
}

// Pagamento registrado pela dona: é a evidência que libera a resposta "pagamento recebido".
async function registrarPagamento(btn){
  const id = Number(btn.getAttribute("data-pago")), pago = btn.getAttribute("data-valor") === "1";
  if (pago && !confirm("Confirma que o pagamento deste pedido já caiu na conta (não só o comprovante)?")) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("registrar_pagamento", { p_pedido_id: id, p_pago: pago });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("pedMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  const p = (dadosPainel.pedidos || []).find(x => x.id === id);
  if (p) p.pago_em = data.pago_em || null;
  renderPedidos();
}

async function mudarStatus(btn){
  const id = Number(btn.getAttribute("data-id"));
  const status = btn.getAttribute("data-status");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { data, error } = await supa.rpc("atualizar_pedido", { p_id: id, p_status: status });
  if (error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const m = $("pedMsg" + id); if (m) m.textContent = "Não foi possível salvar. Tente de novo.";
    return;
  }
  // Atualiza na tela sem recarregar tudo; o pedido sai da aba atual e fica fechado.
  const antes = dadosPainel.pedidos.find(p => p.id === id);
  if (antes){
    if (antes.status === "pendente" && status !== "pendente") dadosPainel.pedidos_pendentes = Math.max(0, Number(dadosPainel.pedidos_pendentes || 0) - 1);
    if (antes.status !== "pendente" && status === "pendente") dadosPainel.pedidos_pendentes = Number(dadosPainel.pedidos_pendentes || 0) + 1;
    antes.status = status; antes.status_em = new Date().toISOString();
  }
  tela.pedido = null;
  render(dadosPainel);
}

// O Stripe guarda de qual negócio e e-mail veio a assinatura (para ativar o plano certo).
function linkPagamento(link, businessId){
  try{
    const u = new URL(link);
    if (businessId) u.searchParams.set("client_reference_id", "negocio_" + businessId);
    if (emailLogado) u.searchParams.set("prefilled_email", emailLogado);
    return u.toString();
  }catch(e){ return link; }
}

async function devolverConversa(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Devolvendo...';
  const { error } = await supa.rpc("devolver_conversa", { p_remetente: btn.getAttribute("data-devolver") });
  if (error){ btn.disabled = false; btn.textContent = "Tentar de novo"; return; }
  carregarPainel();
}

/* ---------- Personalizar a secretária (só para planos pagos) ---------- */
function renderPersonalizar(d){
  const box = $("personalizar");
  if (!d.pode_personalizar){
    box.innerHTML = '<h2>Personalizar sua secretária 🔒</h2>'
      + '<p class="sub">Aqui você ajusta o que a secretária sabe sobre o seu negócio:</p>'
      + '<ul class="pers-lista"><li><b>Perguntas frequentes:</b> as dúvidas que seus clientes sempre fazem e a resposta exata que ela deve dar (ex.: horário, preços, formas de pagamento).</li>'
      + '<li><b>Serviços:</b> você escolhe quais serviços ela oferece aos clientes.</li></ul>'
      + '<div class="aviso info" style="margin-top:14px;"><div class="txt"><b>No teste grátis, a secretária já usa as respostas que você preencheu no cadastro.</b>'
      + 'Para mudar ou acrescentar perguntas, escolha um plano: Light até 5 perguntas, Básico até 10, Premium e Completo até 30.</div>'
      + '<button class="btn btn-primary" type="button" data-ir="plano">Ver planos</button></div>';
    return;
  }
  faqEdicao = (Array.isArray(d.faq) ? d.faq : []).map(f => ({ pergunta: f.pergunta || "", resposta: f.resposta || "" }));
  const servicos = d.servicos || [];
  const ativos = servicos.filter(s => s.ativo).length;
  const resumo = faqEdicao.length + (faqEdicao.length === 1 ? ' pergunta cadastrada' : ' perguntas cadastradas')
    + (servicos.length ? ' · ' + ativos + ' de ' + servicos.length + ' serviços ativos' : '');
  // Abre e fecha só escondendo: o que foi digitado e ainda não salvo continua lá.
  box.innerHTML = '<h2>Personalizar sua secretária</h2><p class="sub">' + esc(resumo) + '</p>'
    + '<div>'
    + '<p class="sub">A secretária responde exatamente com o que estiver aqui. Se faltar uma informação, ela diz que a equipe vai confirmar, e nunca inventa.</p>'
    + '<div class="subtitulo">Perguntas e respostas <span id="faqConta" style="color:var(--muted);font-weight:400;"></span></div><div id="faqLista"></div>'
    + '<button class="btn" type="button" id="faqAdd">+ Adicionar pergunta</button>'
    + (servicos.length ? '<div class="subtitulo">Serviços que você oferece</div>'
      + '<p class="sub" style="margin-bottom:8px;">Desmarque o que você não faz: a secretária deixa de oferecer e tira do menu.</p>'
      + '<div class="servicos">' + servicos.map(s => '<label class="servico"><input type="checkbox" data-servico="' + esc(s.id) + '"' + (s.ativo ? ' checked' : '') + '> ' + esc(s.titulo) + '</label>').join('') + '</div>' : '')
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="salvarPers">Salvar alterações</button><span class="msg" id="persMsg"></span></div></div>';
  renderFaqLista();
  $("faqAdd").addEventListener("click", () => { faqEdicao.push({ pergunta: "", resposta: "" }); renderFaqLista(); });
  $("salvarPers").addEventListener("click", salvarPersonalizacao);
}

function renderFaqLista(){
  const lista = $("faqLista");
  lista.innerHTML = "";
  faqEdicao.forEach((f, i) => {
    const row = document.createElement("div"); row.className = "faq-row";
    const q = document.createElement("input"); q.value = f.pergunta; q.placeholder = "Pergunta (ex.: Vocês atendem aos domingos?)";
    q.addEventListener("input", () => { f.pergunta = q.value; });
    const a = document.createElement("textarea"); a.value = f.resposta; a.placeholder = "Sua resposta";
    a.addEventListener("input", () => { f.resposta = a.value; });
    const del = document.createElement("button"); del.type = "button"; del.className = "faq-del"; del.textContent = "×"; del.title = "Remover";
    del.addEventListener("click", () => { faqEdicao.splice(i, 1); renderFaqLista(); });
    row.appendChild(del); row.appendChild(q); row.appendChild(a); lista.appendChild(row);
  });
  // Limite do plano: Light 5, Básico 10, Premium e Completo 30.
  const limite = Number((dadosPainel && dadosPainel.faq_limite) || 30);
  $("faqAdd").style.display = faqEdicao.length >= limite ? "none" : "inline-block";
  $("faqConta").textContent = "(" + faqEdicao.length + " de " + limite + ")"
    + (faqEdicao.length > limite ? " · o seu plano guarda só as " + limite + " primeiras" : "")
    + (faqEdicao.length >= limite && limite < 30 ? (limite < 10 ? " · no Básico, até 10" : " · no Premium, até 30") : "");
}

async function salvarPersonalizacao(){
  const msg = $("persMsg"); const btn = $("salvarPers");
  msg.className = "msg"; msg.textContent = "";
  const desativados = Array.from(document.querySelectorAll("[data-servico]")).filter(c => !c.checked).map(c => c.getAttribute("data-servico"));
  const faq = faqEdicao.map(f => ({ pergunta: f.pergunta.trim(), resposta: f.resposta.trim() })).filter(f => f.pergunta && f.resposta);
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { error } = await supa.rpc("salvar_personalizacao", { p_faq: faq, p_desativados: desativados });
  btn.disabled = false; btn.textContent = "Salvar alterações";
  if (error){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  msg.className = "msg ok"; msg.textContent = "Salvo! A secretária já usa as informações novas.";
}

/* ---------- Seus dados: nome do negócio (usado pela secretária), nome do dono e WhatsApp de avisos ---------- */
function renderDados(d){
  const box = $("seusDados");
  const resumo = (d.nome || "") + (d.contato_nome ? " · " + d.contato_nome : "");
  const agencia = /viage/i.test(String(d.tipo_negocio || ""));
  const rotuloNome = agencia ? "Nome da sua agência" : "Nome do seu negócio";
  box.innerHTML = '<h2>Seus dados</h2><p class="sub">Essas informações aparecem para os seus clientes e definem para onde vão os avisos.</p>'
    + '<div>'
    + '<div class="campo"><label for="dNome">' + rotuloNome + '</label><input id="dNome" maxlength="80" value="' + esc(d.nome || "") + '">'
    + '<small>É o nome que a secretária usa com os clientes: “Sou a assistente virtual da ' + esc(d.nome || (agencia ? "sua agência" : "sua empresa")) + '”.</small></div>'
    + '<div class="campo"><label for="dContato">Seu nome</label><input id="dContato" maxlength="80" value="' + esc(d.contato_nome || "") + '">'
    + '<small>Para o painel te cumprimentar pelo nome.</small></div>'
    + '<div class="campo"><label for="dWhats">WhatsApp para receber os avisos</label><input id="dWhats" inputmode="tel" maxlength="20" value="' + esc(d.whatsapp_avisos || "") + '">'
    + '<small>Com código do país e DDD, só números. Ex.: 5511999998888. É para onde vão os avisos de pedidos e de clientes esperando.</small></div>'
    + '<div class="acoes"><button class="btn btn-primary" type="button" id="salvarDados">Salvar</button><span class="msg" id="dadosMsg"></span></div>'
    + '</div>';
  $("salvarDados").addEventListener("click", salvarDados);
}

async function salvarDados(){
  const msg = $("dadosMsg"); const btn = $("salvarDados");
  const nome = $("dNome").value.trim();
  const contato = $("dContato").value.trim();
  const whats = $("dWhats").value.replace(/\D/g, "");
  msg.className = "msg"; msg.textContent = "";
  if (nome.length < 2){ msg.className = "msg erro"; msg.textContent = "Escreva o nome da sua agência."; return; }
  if (whats && (whats.length < 10 || whats.length > 15)){ msg.className = "msg erro"; msg.textContent = "Confira o WhatsApp: código do país + DDD + número, só números."; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { error } = await supa.rpc("salvar_dados", { p_nome: nome, p_contato_nome: contato, p_whatsapp: whats });
  btn.disabled = false; btn.textContent = "Salvar";
  if (error){ msg.className = "msg erro"; msg.textContent = "Não foi possível salvar agora. Tente de novo em alguns instantes."; return; }
  await carregarPainel();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  aviso("loginError", ""); aviso("loginOk", "");
  const btn = $("loginBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';
  const { error } = await supa.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false; btn.textContent = "Entrar";
  if (error){ aviso("loginError", "E-mail ou senha incorretos. Confira e tente de novo."); return; }
  mostrar("painel"); carregarPainel();
});

$("forgotBtn").addEventListener("click", async () => {
  aviso("loginError", ""); aviso("loginOk", "");
  const email = $("email").value.trim();
  if (!email){ aviso("loginError", "Digite o seu e-mail acima e clique de novo em “Esqueci minha senha”."); return; }
  const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: PAINEL_URL });
  if (error){ aviso("loginError", "Não conseguimos enviar o e-mail agora. Tente de novo em alguns minutos."); return; }
  aviso("loginOk", "Se este e-mail tiver cadastro, enviamos um link para criar uma nova senha.");
});

$("passwordForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  aviso("passwordError", "");
  const s1 = $("newPassword").value, s2 = $("newPassword2").value;
  if (s1.length < 8){ aviso("passwordError", "A senha precisa ter pelo menos 8 caracteres."); return; }
  if (s1 !== s2){ aviso("passwordError", "As duas senhas não são iguais."); return; }
  const btn = $("passwordBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
  const { error } = await supa.auth.updateUser({ password: s1 });
  btn.disabled = false; btn.textContent = "Salvar senha e entrar";
  if (error){ aviso("passwordError", "Não foi possível salvar a senha. Abra de novo o link do e-mail ou peça um novo em “Esqueci minha senha”."); return; }
  history.replaceState(null, "", window.location.pathname);
  mostrar("painel"); carregarPainel();
});

$("logoutBtn").addEventListener("click", async () => { await supa.auth.signOut(); mostrar("login"); });
$("refreshBtn").addEventListener("click", carregarPainel);
$("sairBtn").addEventListener("click", async () => { await supa.auth.signOut(); fecharMenu(); mostrar("login"); });

$("sideFundo").addEventListener("click", fecharMenu);
function fecharMenu(){ $("side").classList.remove("aberta"); $("sideFundo").classList.remove("aberta"); }
$("sideLogo").src = "/img/auryx-simbolo-branco.png";

(async function iniciar(){
  if (erroNoLink){
    mostrar("login");
    aviso("loginError", "Este link expirou ou já foi usado. Digite seu e-mail e clique em “Esqueci minha senha” para receber um novo.");
    history.replaceState(null, "", window.location.pathname);
    return;
  }
  const { data: { session } } = await supa.auth.getSession();
  if (session && precisaCriarSenha){ mostrar("senha"); return; }
  if (session){ mostrar("painel"); carregarPainel(); return; }
  mostrar("login");
})();
